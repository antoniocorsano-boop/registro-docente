name: AGENT-INTENT-01 Targeted Fix

on:
  push:
    branches:
      - feat/agent-intent-01-agent-first-routing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/agent-intent-01-agent-first-routing
          fetch-depth: 0

      - name: Apply exact causal fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # P1: stale agent responses are ignored, but the UI must always leave resolving state.
          replace_exact(
              'src/components/LibraryCopilotComposer.tsx',
              """    } finally {\n      if (requestIsCurrent()) setIsResolving(false);\n    }\n""",
              """    } finally {\n      setIsResolving(false);\n    }\n"""
          )

          # P2: provider absence is a normal local-fallback state; expose a clean 200 preflight.
          server_anchor = """app.post(\n  '/api/copilot/intent',\n"""
          server_insert = """app.get('/api/copilot/intent/provider', (_req, res) => {\n  return res.json({\n    available: Boolean(process.env.GEMINI_API_KEY?.trim()),\n    provider: agentIntentProvider.descriptor.displayName,\n    model: agentIntentProvider.descriptor.model\n  });\n});\n\napp.post(\n  '/api/copilot/intent',\n"""
          replace_exact('server.ts', server_anchor, server_insert)

          browser = Path('tests/browser/agent-intent-01-routing.spec.cjs')
          text = browser.read_text()
          route_anchor = """  await page.route('**/api/copilot/intent', async route => {\n"""
          available_route = """  await page.route('**/api/copilot/intent/provider', async route => {\n    await route.fulfill({\n      status: 200,\n      contentType: 'application/json',\n      body: JSON.stringify({ available: true, provider: 'Browser Provider', model: 'browser-fixture-v1' })\n    });\n  });\n  await page.route('**/api/copilot/intent', async route => {\n"""
          if text.count(route_anchor) < 3:
              raise SystemExit('browser spec: expected three intent POST route interceptors')
          text = text.replace(route_anchor, available_route, 2)

          fallback_old = """  await page.route('**/api/copilot/intent', async route => {\n    await route.fulfill({ status: 503, contentType: 'application/json', body: JSON.stringify({ error: { code: 'PROVIDER_UNAVAILABLE' } }) });\n  });\n\n  const composer = await bootstrap(page);\n"""
          fallback_new = """  let unexpectedIntentPostCount = 0;\n  await page.route('**/api/copilot/intent/provider', async route => {\n    await route.fulfill({\n      status: 200,\n      contentType: 'application/json',\n      body: JSON.stringify({ available: false, provider: 'Browser Provider', model: 'browser-fixture-v1' })\n    });\n  });\n  await page.route('**/api/copilot/intent', async route => {\n    unexpectedIntentPostCount += 1;\n    await route.fulfill({ status: 500, contentType: 'application/json', body: JSON.stringify({ error: { code: 'UNEXPECTED_POST' } }) });\n  });\n\n  const composer = await bootstrap(page);\n"""
          if fallback_old not in text:
              raise SystemExit('browser spec: fallback block anchor not found')
          text = text.replace(fallback_old, fallback_new, 1)

          fallback_assert_anchor = """  await expect(composer.getByTestId('library-copilot-review-panel')).toHaveCount(0);\n  expect(guards.pageErrors).toEqual([]);\n"""
          fallback_assert_new = """  await expect(composer.getByTestId('library-copilot-review-panel')).toHaveCount(0);\n  expect(unexpectedIntentPostCount).toBe(0);\n  expect(guards.pageErrors).toEqual([]);\n"""
          if fallback_assert_anchor not in text:
              raise SystemExit('browser spec: fallback assertion anchor not found')
          text = text.replace(fallback_assert_anchor, fallback_assert_new, 1)
          browser.write_text(text)
          PY

      - name: Verify targeted diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/components/LibraryCopilotComposer.tsx server.ts tests/browser/agent-intent-01-routing.spec.cjs

      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LibraryCopilotComposer.tsx server.ts tests/browser/agent-intent-01-routing.spec.cjs
          git diff --cached --quiet && { echo 'No patch required'; exit 0; }
          git commit -m 'fix: close agent-first browser regressions'
          git push origin HEAD:feat/agent-intent-01-agent-first-routing
