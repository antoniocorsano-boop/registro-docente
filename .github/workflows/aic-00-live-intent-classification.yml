name: AIC-00 Post-Republish Live Classification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  RELEASE_SHA: '315c467494fbdc7d4185863410483c96dc79899c'
  PUBLIC_URL: 'https://registro-docente.ai.studio'

jobs:
  post-republish-live-classification:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout exact integrated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected release SHA: ${RELEASE_SHA}"
          echo "Checkout SHA:         ${actual_sha}"
          test "${actual_sha}" = "${RELEASE_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Capture exact source bundle fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aic00-evidence
          expected_asset="$(grep -Eo 'src="/assets/[^"]+\.js[^\"]*"' dist/index.html | sed -E 's/^src="//; s/"$//' | head -n1)"
          test -n "$expected_asset"
          expected_file="dist${expected_asset%%\?*}"
          test -s "$expected_file"
          expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
          if grep -q 'data-agent-intent-fallback-code' "$expected_file"; then expected_marker=true; else expected_marker=false; fi
          printf '%s\n' "$expected_asset" > aic00-evidence/expected-asset.txt
          printf '%s\n' "$expected_sha" > aic00-evidence/expected-asset-sha256.txt
          printf '%s\n' "$expected_marker" > aic00-evidence/expected-diagnostic-marker.txt
          test "$expected_marker" = 'true'

      - name: Capture public bundle fingerprint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "${PUBLIC_URL}/" \
            -D aic00-evidence/public-headers.txt \
            -o aic00-evidence/public-index.html
          test -s aic00-evidence/public-index.html
          public_asset="$(grep -Eo 'src="/assets/[^"]+\.js[^\"]*"' aic00-evidence/public-index.html | sed -E 's/^src="//; s/"$//' | head -n1)"
          test -n "$public_asset"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "${PUBLIC_URL}${public_asset}" \
            -o aic00-evidence/public-app.js
          public_sha="$(sha256sum aic00-evidence/public-app.js | awk '{print $1}')"
          if grep -q 'data-agent-intent-fallback-code' aic00-evidence/public-app.js; then public_marker=true; else public_marker=false; fi
          printf '%s\n' "$public_asset" > aic00-evidence/public-asset.txt
          printf '%s\n' "$public_sha" > aic00-evidence/public-asset-sha256.txt
          printf '%s\n' "$public_marker" > aic00-evidence/public-diagnostic-marker.txt

      - name: Require exact publication alignment
        shell: bash
        run: |
          set -euo pipefail
          expected_asset="$(cat aic00-evidence/expected-asset.txt)"
          public_asset="$(cat aic00-evidence/public-asset.txt)"
          expected_sha="$(cat aic00-evidence/expected-asset-sha256.txt)"
          public_sha="$(cat aic00-evidence/public-asset-sha256.txt)"
          expected_marker="$(cat aic00-evidence/expected-diagnostic-marker.txt)"
          public_marker="$(cat aic00-evidence/public-diagnostic-marker.txt)"

          RELEASE_SHA="${RELEASE_SHA}" PUBLIC_URL="${PUBLIC_URL}" \
          EXPECTED_ASSET="$expected_asset" PUBLIC_ASSET="$public_asset" \
          EXPECTED_SHA="$expected_sha" PUBLIC_SHA="$public_sha" \
          EXPECTED_MARKER="$expected_marker" PUBLIC_MARKER="$public_marker" \
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            releaseSha: process.env.RELEASE_SHA,
            publicUrl: process.env.PUBLIC_URL,
            expectedAsset: process.env.EXPECTED_ASSET,
            publicAsset: process.env.PUBLIC_ASSET,
            assetNameMatch: process.env.EXPECTED_ASSET === process.env.PUBLIC_ASSET,
            expectedAssetSha256: process.env.EXPECTED_SHA,
            publicAssetSha256: process.env.PUBLIC_SHA,
            assetContentMatch: process.env.EXPECTED_SHA === process.env.PUBLIC_SHA,
            expectedDiagnosticMarker: process.env.EXPECTED_MARKER === 'true',
            publicDiagnosticMarker: process.env.PUBLIC_MARKER === 'true'
          };
          fs.writeFileSync('aic00-evidence/aic-00-publication-audit.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));
          if (!evidence.assetNameMatch || !evidence.assetContentMatch || !evidence.publicDiagnosticMarker) process.exit(1);
          NODE

      - name: Probe live intent provider metadata
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -o aic00-evidence/provider-response.json \
            -w '%{http_code}' \
            "${PUBLIC_URL}/api/copilot/intent/provider")"
          printf '%s\n' "$status" > aic00-evidence/provider-status.txt
          test "$status" = '200'

      - name: Submit canonical live routing request once
        shell: bash
        run: |
          set -euo pipefail
          cat > aic00-evidence/intent-request.json <<'JSON'
          {
            "schema": "registro.agent-routing-request/v1",
            "message": "Preparazione Attività per fare comprendere il funzionamento della centrale elettrica",
            "context": {
              "surface": "library",
              "hasCurrentClass": true,
              "hasCurrentUda": true,
              "hasSelectedSource": true
            },
            "explicitTeacherSubmission": true
          }
          JSON
          started="$(date +%s%3N)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 40 \
            -H 'Content-Type: application/json' \
            --data-binary @aic00-evidence/intent-request.json \
            -o aic00-evidence/intent-response.json \
            -w '%{http_code}' \
            "${PUBLIC_URL}/api/copilot/intent")"
          ended="$(date +%s%3N)"
          printf '%s\n' "$status" > aic00-evidence/intent-status.txt
          printf '%s\n' "$((ended-started))" > aic00-evidence/intent-duration-ms.txt

      - name: Classify AIC-00 result
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="${RELEASE_SHA}" PUBLIC_URL="${PUBLIC_URL}" node <<'NODE'
          const fs = require('node:fs');
          const read = path => fs.readFileSync(path, 'utf8').trim();
          const parse = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const allowedFallbackCodes = new Set([
            'PROVIDER_NOT_CONFIGURED',
            'PROVIDER_RATE_LIMITED',
            'PROVIDER_TIMEOUT',
            'PROVIDER_BLOCKED',
            'PROVIDER_UNAVAILABLE',
            'PROVIDER_OUTPUT_INVALID',
            'PROVIDER_ERROR'
          ]);

          const publication = parse('aic00-evidence/aic-00-publication-audit.json');
          const provider = parse('aic00-evidence/provider-response.json');
          const intentStatus = Number(read('aic00-evidence/intent-status.txt'));
          const durationMs = Number(read('aic00-evidence/intent-duration-ms.txt'));
          const response = parse('aic00-evidence/intent-response.json');

          let result = 'UNCLASSIFIED';
          let routeCode = null;
          if (intentStatus === 200 && response?.intent?.intent === 'PREPARE') {
            result = 'ROUTED_PREPARE';
          } else if (typeof response?.error?.code === 'string' && allowedFallbackCodes.has(response.error.code)) {
            routeCode = response.error.code;
            result = `CLASSIFIED_FALLBACK:${routeCode}`;
          }

          const evidence = {
            releaseSha: process.env.RELEASE_SHA,
            publicUrl: process.env.PUBLIC_URL,
            publicationAligned: Boolean(publication.assetNameMatch && publication.assetContentMatch && publication.publicDiagnosticMarker),
            providerStatus: Number(read('aic00-evidence/provider-status.txt')),
            providerAvailable: provider?.available ?? null,
            provider: provider?.provider ?? null,
            model: provider?.model ?? null,
            canonicalPhrase: 'Preparazione Attività per fare comprendere il funzionamento della centrale elettrica',
            intentStatus,
            durationMs,
            result,
            routeCode,
            intent: response?.intent?.intent ?? null,
            confidence: response?.intent?.confidence ?? null,
            needsClarification: response?.intent?.needsClarification ?? null
          };
          fs.writeFileSync('aic00-evidence/aic-00-live.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));

          if (!evidence.publicationAligned) process.exit(2);
          if (result === 'ROUTED_PREPARE' || result.startsWith('CLASSIFIED_FALLBACK:')) process.exit(0);
          process.exit(1);
          NODE

      - name: Upload AIC-00 post-republish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic-00-post-republish-${{ env.RELEASE_SHA }}
          path: aic00-evidence/
          if-no-files-found: error
          retention-days: 7
