name: AIC-00 Public Bundle Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  RELEASE_SHA: '315c467494fbdc7d4185863410483c96dc79899c'
  PUBLIC_URL: 'https://registro-docente.ai.studio'

jobs:
  public-bundle-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout exact integrated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected release SHA: ${RELEASE_SHA}"
          echo "Checkout SHA:         ${actual_sha}"
          test "${actual_sha}" = "${RELEASE_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Capture expected bundle fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aic00-evidence/public-assets
          test -s dist/index.html
          grep -Eo 'src="/assets/[^"]+\.js[^\"]*"' dist/index.html \
            | sed -E 's/^src="//; s/"$//' \
            | sort -u \
            > aic00-evidence/expected-js-assets.txt
          test -s aic00-evidence/expected-js-assets.txt

          if grep -R -q --include='*.js' 'data-agent-intent-fallback-code' dist/assets; then
            printf 'true\n' > aic00-evidence/expected-diagnostic-marker.txt
          else
            printf 'false\n' > aic00-evidence/expected-diagnostic-marker.txt
          fi

          find dist/assets -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > aic00-evidence/expected-js-sha256.txt

      - name: Capture public bundle fingerprint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "${PUBLIC_URL}/" \
            -D aic00-evidence/public-headers.txt \
            -o aic00-evidence/public-index.html
          test -s aic00-evidence/public-index.html

          grep -Eo 'src="/assets/[^"]+\.js[^\"]*"' aic00-evidence/public-index.html \
            | sed -E 's/^src="//; s/"$//' \
            | sort -u \
            > aic00-evidence/public-js-assets.txt
          test -s aic00-evidence/public-js-assets.txt

          marker=false
          : > aic00-evidence/public-js-sha256.txt
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            base="$(basename "${asset%%\?*}")"
            target="aic00-evidence/public-assets/${base}"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "${PUBLIC_URL}${asset}" \
              -o "$target"
            sha256sum "$target" >> aic00-evidence/public-js-sha256.txt
            if grep -q 'data-agent-intent-fallback-code' "$target"; then
              marker=true
            fi
          done < aic00-evidence/public-js-assets.txt
          printf '%s\n' "$marker" > aic00-evidence/public-diagnostic-marker.txt
          printf 'public_url=%s\nrelease_sha=%s\n' "${PUBLIC_URL}" "${RELEASE_SHA}" > aic00-evidence/release-metadata.txt

      - name: Compare exact source and public bundle
        shell: bash
        run: |
          set -euo pipefail
          if diff -u aic00-evidence/expected-js-assets.txt aic00-evidence/public-js-assets.txt \
            > aic00-evidence/js-assets.diff; then
            asset_match=true
          else
            asset_match=false
          fi

          expected_marker="$(cat aic00-evidence/expected-diagnostic-marker.txt)"
          public_marker="$(cat aic00-evidence/public-diagnostic-marker.txt)"

          RELEASE_SHA="${RELEASE_SHA}" \
          PUBLIC_URL="${PUBLIC_URL}" \
          ASSET_MATCH="$asset_match" \
          EXPECTED_MARKER="$expected_marker" \
          PUBLIC_MARKER="$public_marker" \
          node <<'NODE'
          const fs = require('node:fs');
          const lines = path => fs.readFileSync(path, 'utf8').split(/\r?\n/).map(v => v.trim()).filter(Boolean);
          const evidence = {
            releaseSha: process.env.RELEASE_SHA,
            publicUrl: process.env.PUBLIC_URL,
            expectedAssets: lines('aic00-evidence/expected-js-assets.txt'),
            publicAssets: lines('aic00-evidence/public-js-assets.txt'),
            assetFingerprintMatch: process.env.ASSET_MATCH === 'true',
            expectedDiagnosticMarker: process.env.EXPECTED_MARKER === 'true',
            publicDiagnosticMarker: process.env.PUBLIC_MARKER === 'true'
          };
          fs.writeFileSync('aic00-evidence/aic-00-publication-audit.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));
          if (!evidence.expectedDiagnosticMarker) {
            console.error('Exact source build itself lacks the AGENT-INTENT-02 marker; audit assumption invalid.');
            process.exit(2);
          }
          if (!evidence.assetFingerprintMatch || !evidence.publicDiagnosticMarker) process.exit(1);
          NODE

      - name: Upload AIC-00 publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic-00-publication-${{ env.RELEASE_SHA }}
          path: aic00-evidence/
          if-no-files-found: error
          retention-days: 7
