name: AIC-01 Source Card Race Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-source-card-race-repair:
    if: github.head_ref == 'feat/aic-01-unified-context-projection'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aic-01-unified-context-projection
          fetch-depth: 0
      - name: Apply exact initialization timing repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/components/LibrarySourceCard.tsx')
          text = path.read_text()
          old_import = "import React, { useEffect, useRef, useState } from 'react';"
          new_import = "import React, { useLayoutEffect, useRef, useState } from 'react';"
          if new_import in text and '  useLayoutEffect(() => {' in text:
              print('repair already applied')
              raise SystemExit(0)
          if text.count(old_import) != 1:
              raise SystemExit(f'import occurrence mismatch: {text.count(old_import)}')
          if text.count('  useEffect(() => {') != 1:
              raise SystemExit(f'initialization effect occurrence mismatch: {text.count("  useEffect(() => {")}')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('  useEffect(() => {', '  useLayoutEffect(() => {', 1)
          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LibrarySourceCard.tsx
          git commit -m 'fix: initialize selected source context before paint'
          git push origin HEAD:feat/aic-01-unified-context-projection
