name: AIC-01 Stale Repair Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-stale-repair:
    if: github.head_ref == 'feat/aic-01-unified-context-projection'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aic-01-unified-context-projection
          fetch-depth: 0
      - name: Apply one exact dependency repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/components/LibraryCopilotComposer.tsx')
          text = path.read_text()
          old = '[selectedSourceId, teachingContextFingerprint, copilotContextFingerprint]'
          new = '[selectedSourceId, teachingContextFingerprint]'
          count = text.count(old)
          if count == 0 and new in text:
              print('repair already applied')
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'expected exactly one dependency occurrence, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LibraryCopilotComposer.tsx
          git commit -m 'fix: preserve resolved Copilot disclosure across surface navigation'
          git push origin HEAD:feat/aic-01-unified-context-projection
