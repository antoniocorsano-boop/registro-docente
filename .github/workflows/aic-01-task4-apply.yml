name: AIC-01 Task 4 Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-task4:
    if: github.head_ref == 'feat/aic-01-unified-context-projection'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/aic-01-unified-context-projection
          fetch-depth: 0

      - name: Apply exact Task 4 patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          composer_path = Path('src/components/LibraryCopilotComposer.tsx')
          app = app_path.read_text()
          composer = composer_path.read_text()

          done_marker = 'buildAgentRoutingRequestFromProjection(message.trim(), copilotContextProjection)'
          app_marker = "activeTab === 'programmazione' ? 'planning'"
          if done_marker in composer and app_marker in app:
              print('Task 4 patch already applied; no mutation required.')
              raise SystemExit(0)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str, flags=0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex occurrence, found {count}')
              return updated

          app = regex_once(
              app,
              r"(?P<indent>\s*): activeTab === 'uda-gantt' \? 'uda'\n(?P=indent)  : 'global',",
              lambda m: (
                  f"{m.group('indent')}: activeTab === 'uda-gantt' ? 'uda'\n"
                  f"{m.group('indent')}  : activeTab === 'programmazione' ? 'planning'\n"
                  f"{m.group('indent')}    : activeTab === 'verifiche-online' ? 'online-tests'\n"
                  f"{m.group('indent')}      : activeTab === 'voti' ? 'evaluations'\n"
                  f"{m.group('indent')}        : 'other-teacher-surface',"
              ),
              'App ambient Copilot surface mapping'
          )

          composer = regex_once(
              composer,
              r"import \{ AgentIntentClientError, interpretCopilotIntent \} from '../services/agentIntentService';\nimport \{\n\s*buildAgentRoutingRequest,\n\s*type AgentRoutingSurface\n\} from '../library/agentIntent';",
              "import { AgentIntentClientError, interpretCopilotIntent } from '../services/agentIntentService';\nimport { buildCopilotContextProjection } from '../copilot/contextProjection';\nimport { buildAgentRoutingRequestFromProjection } from '../library/agentIntent';",
              'Composer projection imports'
          )

          composer = regex_once(
              composer,
              r"function agentRoutingSurface\(surface: CopilotLaunchContext\['surface'\] \| undefined\): AgentRoutingSurface \{.*?\n\}\n\n",
              '',
              'Composer legacy surface helper',
              re.S
          )

          projection_block = """  const copilotContextProjection = useMemo(() => buildCopilotContextProjection({
            surface: ambientContext?.surface ?? launchRequest?.context.surface ?? 'library',
            className: resolvedTeachingContext?.className ?? effectiveClassName ?? null,
            udaId: resolvedTeachingContext?.udaId ?? null,
            lessonId: resolvedTeachingContext?.lessonId ?? null,
            sourceId: selectedSource?.id ?? null,
            planningProfileId: resolvedPlanningContext?.status === 'resolved'
              ? resolvedPlanningContext.profile.id
              : null
          }), [
            ambientContext?.surface,
            launchRequest?.context.surface,
            effectiveClassName,
            teachingContextFingerprint,
            selectedSource?.id,
            resolvedPlanningContext
          ]);
          const copilotContextFingerprint = JSON.stringify(copilotContextProjection);

          """
          marker = '  const proposalUda = useMemo(() => {'
          if composer.count(marker) != 1:
              raise SystemExit(f'Composer projection insertion marker: expected 1, found {composer.count(marker)}')
          composer = composer.replace(marker, projection_block + marker, 1)

          composer = regex_once(
              composer,
              r"  const currentResolutionSnapshot = selectedSource\n\s*\? JSON\.stringify\(buildLibraryCopilotRequest\(\{\n\s*source: selectedSource,\n\s*teachingContext: resolvedTeachingContext,\n\s*planningContext: resolvedPlanningContext,\n\s*message: message\.trim\(\)\n\s*\}\)\)\n\s*: '';",
              """  const currentResolutionSnapshot = selectedSource
            ? JSON.stringify({
                request: buildLibraryCopilotRequest({
                  source: selectedSource,
                  teachingContext: resolvedTeachingContext,
                  planningContext: resolvedPlanningContext,
                  message: message.trim()
                }),
                contextProjection: copilotContextProjection
              })
            : '';""",
              'Composer stale snapshot projection'
          )

          composer = replace_once(
              composer,
              '[selectedSourceId, teachingContextFingerprint]',
              '[selectedSourceId, teachingContextFingerprint, copilotContextFingerprint]',
              'Composer stale invalidation dependencies'
          )

          composer = regex_once(
              composer,
              r"        const agentRequest = buildAgentRoutingRequest\(\{\n\s*message: message\.trim\(\),\n\s*surface: agentRoutingSurface\(launchRequest\?\.context\.surface \?\? ambientContext\?\.surface \?\? 'library'\),\n\s*hasCurrentClass: Boolean\(effectiveClassName \|\| resolvedTeachingContext\?\.className\),\n\s*hasCurrentUda: Boolean\(resolvedTeachingContext\?\.udaId\),\n\s*hasSelectedSource: true\n\s*\}\);",
              '        const agentRequest = buildAgentRoutingRequestFromProjection(message.trim(), copilotContextProjection);',
              'Composer routing request builder'
          )

          app_path.write_text(app)
          composer_path.write_text(composer)
          PY

          git diff --check
          if git diff --quiet; then
            echo 'No patch commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/LibraryCopilotComposer.tsx
          git commit -m 'feat: wire unified Copilot context projection'
          git push origin HEAD:feat/aic-01-unified-context-projection
