name: AIC-02 Browser Test Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/aic-02-prepare-outcome-loop'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Repair only AIC-02 browser assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/browser/aic-02-prepare-outcome.spec.cjs')
          text = path.read_text()
          rules = [
              (
                  "  await expect(adoptedCard.getByText(UDA_TITLE, { exact: true })).toBeVisible();",
                  "  const linkedUdaRow = adoptedCard.getByRole('button', { name: 'Scollega', exact: true }).locator('xpath=..');\n  await expect(linkedUdaRow.getByText(UDA_TITLE, { exact: true })).toBeVisible();",
                  1,
              ),
              (
                  "  const patched = await delayFutureVaultEncryption(page, 700);",
                  "  const patched = await delayFutureVaultEncryption(page, 5000);",
                  1,
              ),
              (
                  "  await expect(libraryOnly).toBeDisabled();\n  await expect(compound).toBeDisabled();\n  await expect(leave).toBeDisabled();",
                  "  await expect(libraryOnly).toBeDisabled({ timeout: 1000 });\n  await expect(compound).toBeDisabled({ timeout: 1000 });\n  await expect(leave).toBeDisabled({ timeout: 1000 });",
                  1,
              ),
          ]

          for old, new, expected in rules:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s), found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)

      - name: Commit test-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/browser/aic-02-prepare-outcome.spec.cjs; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/aic-02-prepare-outcome.spec.cjs
          git commit -m 'test: make AIC-02 browser assertions deterministic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
