name: AIC-02 Legacy Browser Label Patcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/aic-02-prepare-outcome-loop'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Update only obsolete browser labels
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'tests/browser/lib01d-governed-proposal-qualification.spec.cjs': [
                  (
                      "getByRole('button', { name: 'Salva adattamento', exact: true })",
                      "getByRole('button', { name: 'Adotta in Biblioteca', exact: true })",
                      1,
                  ),
                  (
                      "await assertAtLeast44(disclosure.getByRole('button', { name: 'Adotta', exact: true }), 'mobile adopt');",
                      "await assertAtLeast44(disclosure.getByRole('button', { name: 'Adotta in Biblioteca', exact: true }), 'mobile Library-only adopt');\n  await assertAtLeast44(disclosure.getByRole('button', { name: \"Adotta e aggiungi all'UDA\", exact: true }), 'mobile compound adopt');",
                      1,
                  ),
              ],
              'tests/browser/lib01e-governed-provider-runtime.spec.cjs': [
                  (
                      "getByRole('button', { name: 'Salva adattamento', exact: true })",
                      "getByRole('button', { name: 'Adotta in Biblioteca', exact: true })",
                      1,
                  ),
              ],
              'tests/browser/lib04d-copilot-prepare.spec.cjs': [
                  (
                      "getByRole('button', { name: 'Adotta', exact: true }).click()",
                      "getByRole('button', { name: 'Adotta in Biblioteca', exact: true }).click()",
                      1,
                  ),
                  (
                      "await assertAtLeast44(disclosure.getByRole('button', { name: 'Adotta', exact: true }), 'mobile adopt');",
                      "await assertAtLeast44(disclosure.getByRole('button', { name: 'Adotta in Biblioteca', exact: true }), 'mobile Library-only adopt');\n  await assertAtLeast44(disclosure.getByRole('button', { name: \"Adotta e aggiungi all'UDA\", exact: true }), 'mobile compound adopt');",
                      1,
                  ),
              ],
          }

          changed = []
          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new, expected_count in rules:
                  count = text.count(old)
                  if count == 0 and new in text:
                      continue
                  if count != expected_count:
                      raise SystemExit(f'{filename}: expected {expected_count} occurrence(s), found {count}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)

          print('changed:', changed)

      - name: Commit test-only patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/browser; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/lib01d-governed-proposal-qualification.spec.cjs \
                  tests/browser/lib01e-governed-provider-runtime.spec.cjs \
                  tests/browser/lib04d-copilot-prepare.spec.cjs
          git commit -m 'test: align legacy PREPARE browser labels with AIC-02'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
