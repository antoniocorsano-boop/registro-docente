name: BETA2-UPDATE-02 — exact Beta1 archive compatibility
on:
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BETA1_SHA: 37c61d4c64993c986a3edcd2b421310adf20de92
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout the exact original Beta1 RC2 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BETA1_SHA }}
          path: .beta1-exact
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated fixtures from both exact source trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/.beta1-exact" rev-parse HEAD)" = "$BETA1_SHA"
          mkdir -p "$RUNNER_TEMP/archive-fixtures" browser-evidence .browser-tools
          mkdir -p "$GITHUB_WORKSPACE/.beta1-exact/tests/browser/fixtures"
          cp tests/browser/fixtures/beta2-archive-compatibility.fixture.ts "$GITHUB_WORKSPACE/.beta1-exact/tests/browser/fixtures/beta2-archive-compatibility.fixture.ts"
          bun install --frozen-lockfile
          bun run lint
          bun build tests/browser/fixtures/beta2-archive-compatibility.fixture.ts --target browser --outfile "$RUNNER_TEMP/archive-fixtures/beta2.js"
          (
            cd "$GITHUB_WORKSPACE/.beta1-exact"
            bun install --frozen-lockfile
            bun build tests/browser/fixtures/beta2-archive-compatibility.fixture.ts --target browser --outfile "$RUNNER_TEMP/archive-fixtures/beta1.js"
          )
          printf '<!doctype html><meta charset="utf-8"><title>Synthetic archive compatibility</title>' > "$RUNNER_TEMP/archive-fixtures/index.html"
          printf 'Beta1 source=%s\nBeta2 source=%s\n' "$BETA1_SHA" "$CANDIDATE_SHA" > browser-evidence/provenance.txt
          sha256sum "$RUNNER_TEMP/archive-fixtures/"*.js >> browser-evidence/provenance.txt
      - name: Prepare browser tools
        run: |
          echo '{"name":"registro-beta2-archive-browser","private":true}' > .browser-tools/package.json
          npm --prefix .browser-tools install --save-exact --package-lock=false '@playwright/test@1.64.1'
          timeout --signal=TERM --kill-after=5s 120s ./.browser-tools/node_modules/.bin/playwright install chromium
          cp tests/browser/beta2-archive-compatibility.spec.cjs .browser-tools/
      - name: Start isolated local origin
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/archive-fixtures" > browser-evidence/server.log 2>&1 &
          echo $! > browser-evidence/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify old vault and encrypted backup with candidate
        working-directory: .browser-tools
        run: |
          export BETA1_ARCHIVE_BUNDLE="$RUNNER_TEMP/archive-fixtures/beta1.js"
          export BETA2_ARCHIVE_BUNDLE="$RUNNER_TEMP/archive-fixtures/beta2.js"
          ./node_modules/.bin/playwright test \
            beta2-archive-compatibility.spec.cjs \
            --workers=1 --output=../browser-evidence/results
      - if: always()
        run: test ! -f browser-evidence/server.pid || kill "$(cat browser-evidence/server.pid)" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta2-archive-compatibility-${{ env.CANDIDATE_SHA }}
          path: browser-evidence/
          retention-days: 7
