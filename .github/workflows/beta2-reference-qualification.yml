      - name: Verify exact APK provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LAB_SOURCE_SHA"
          mkdir -p native-evidence
          APK="$(find lab-apk -name app-debug.apk -type f)"
          MANIFEST="$(find lab-apk -name probe-manifest.txt -type f)"
          HASH="$(find lab-apk -name app-debug.sha256 -type f)"
          test -f "$APK" && test -f "$MANIFEST" && test -f "$HASH"
          grep -Fx "source_sha=$LAB_SOURCE_SHA" "$MANIFEST"
          grep -Fx "application_candidate_sha=$LAB_SOURCE_SHA" "$MANIFEST"
          grep -Fx "app_id=$LAB_PACKAGE" "$MANIFEST"
          grep -Fx 'release_signing=false' "$MANIFEST"
          digest="$(sha256sum "$APK" | cut -d' ' -f1)"
          test "$digest" = "$(cut -d' ' -f1 "$HASH")"
          grep -Fx "apk_sha256=$digest" "$MANIFEST"
          cp "$MANIFEST" native-evidence/probe-manifest.txt
          printf 'APK=%s\n' "$APK" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable hardware acceleration on isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot native Android and exercise exact APK
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        timeout-minutes: 16
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
