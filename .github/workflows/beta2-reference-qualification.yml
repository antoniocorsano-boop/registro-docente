          jq -e --arg sha "$LAB_SOURCE_SHA" --argjson api "$LAB_API" --arg stage 'native-session-complete' '.sourceSha == $sha and .api == $api and .releaseQualified == false and any(.results[]; .stage == $stage and .status == "PASS") and all(.results[]; .status != "FAIL")' native-evidence/sec-session-native-result.json
      - name: Preserve native synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta2-native-session-api${{ matrix.api }}-${{ env.LAB_SOURCE_SHA }}
