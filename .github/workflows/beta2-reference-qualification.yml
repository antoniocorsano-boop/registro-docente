  technical-receipt:
    if: always() && contains(fromJSON('["ci/beta2-historical-reference","ci/beta2-native-reference","ci/beta2-reference-qualification","ci/beta2-session-reference","fix/sec-session-01-protected-back","fix/b43-privacy-history","test/b4-3-android-lab"]'), github.head_ref)
    needs: [contracts, chromium, historical-browser, package, native-back, native-locked-back, native-session, native-archive]
    runs-on: ubuntu-22.04
    steps:
      - name: Record technical gates without granting release authorization
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          CHROMIUM: ${{ needs.chromium.result }}
          HISTORICAL: ${{ needs.historical-browser.result }}
          PACKAGE: ${{ needs.package.result }}
          BACK: ${{ needs.native-back.result }}
          LOCKED_BACK: ${{ needs.native-locked-back.result }}
          ARCHIVE: ${{ needs.native-archive.result }}
          SESSION: ${{ needs.native-session.result }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" --arg a "$CONTRACTS" --arg b "$CHROMIUM" --arg history "$HISTORICAL" --arg c "$PACKAGE" --arg d "$BACK" --arg e "$ARCHIVE" --arg f "$SESSION" --arg g "$LOCKED_BACK" '{sourceSha:$sha,runId:$run,gates:{contracts:$a,chromium:$b,historicalBrowser:$history,package:$c,nativeBack:$d,nativeArchive:$e,nativeSession:$f,nativeLockedBack:$g},technicalPass:([$a,$b,$history,$c,$d,$e,$f,$g]|all(.=="success")),releaseAuthorized:false,humanReview:"PENDING",remainingCoverage:["native dirty drafts and post-restore history","physical offline, lock, PDF, upgrade and migration"]}' > beta2-technical-receipt.json
          cat beta2-technical-receipt.json
          jq -e '.technicalPass == true' beta2-technical-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta2-technical-receipt-${{ env.CANDIDATE_SHA }}
          path: beta2-technical-receipt.json
          if-no-files-found: error
          retention-days: 7
