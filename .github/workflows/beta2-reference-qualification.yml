      - name: Boot native Android and exercise exact APK
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        timeout-minutes: 16
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trama-native-locked-back-api${{ matrix.api }}
          emulator-boot-timeout: 240
          disable-animations: false
          disable-linux-hw-accel: false
          script: bash scripts/diagnostics/run-sec-session-final-boundary.sh
      - name: Require terminal evidence, not merely runner success
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'EMULATOR_PREFLIGHT_PASS' native-evidence/emulator-readiness.txt
          test -s native-evidence/logcat-full.txt
          jq -e --arg sha "$LAB_SOURCE_SHA" --argjson api "$LAB_API" '.sourceSha == $sha and .api == $api and .releaseQualified == false and all(.results[]; .status != "FAIL") and any(.results[]; .stage == "locked-back-observation-complete" and .status == "PASS")' native-evidence/sec-session-boundary-result.json
          for stage in locked-key-route locked-edge-route locked-no-popstate resume-no-draft-dialog resume-draft-and-route manual-locked-no-popstate manual-lock-restarts-home; do
            jq -e --arg stage "$stage" 'any(.results[]; .stage == $stage and .status == "PASS")' native-evidence/sec-session-boundary-result.json
          done
      - name: Preserve native synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta2-native-locked-back-api${{ matrix.api }}-${{ env.LAB_SOURCE_SHA }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 7

