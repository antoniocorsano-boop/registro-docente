    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [36]
    env:
      LAB_API: ${{ matrix.api }}
      LAB_PACKAGE: it.trama.registrodocente.lab.b43
      LAB_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_SOURCE_SHA }}
          persist-credentials: false
      - name: Download the single APK from this run
        uses: actions/download-artifact@v4
        with:
