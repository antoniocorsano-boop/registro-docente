name: UX-TRUST-01 Full App Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.64.1'
  LIVE_URL: 'https://registro-docente.ai.studio'
  PRODUCT_SOURCE_SHA: 'ad4dfcc2fabacbb05ce7d9a080ad06be73de0fed'

jobs:
  full-app-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact audit harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify audit harness checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Audit harness SHA: ${GITHUB_SHA}"
          echo "Checkout SHA:      ${actual_sha}"
          test "${actual_sha}" = "${GITHUB_SHA}"
          echo "Product source baseline: ${PRODUCT_SOURCE_SHA}"

      - name: Probe public deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ux-audit-evidence
          curl --fail --silent --show-error --location \
            --dump-header ux-audit-evidence/live-headers.txt \
            "${LIVE_URL}/" \
            -o ux-audit-evidence/live-index.html
          grep -Eo 'assets/index-[A-Za-z0-9_-]+\.(js|css)' ux-audit-evidence/live-index.html \
            | sort -u \
            | tee ux-audit-evidence/live-assets.txt || true

      - name: Setup Node for isolated Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Playwright toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .browser-tools ux-audit-evidence
          cat > .browser-tools/package.json <<'JSON'
          {
            "name": "registro-docente-ux-trust-01-audit",
            "private": true
          }
          JSON
          npm --prefix .browser-tools install \
            --save-exact \
            --package-lock=false \
            "@playwright/test@${PLAYWRIGHT_VERSION}"
          ./.browser-tools/node_modules/.bin/playwright install --with-deps chromium
          cp tests/browser/ux-trust-01-audit.spec.cjs .browser-tools/ux-trust-01-audit.spec.cjs

      - name: Run full live Chromium UX audit
        shell: bash
        run: |
          set -euo pipefail
          cd .browser-tools
          BASE_URL="${LIVE_URL}" \
          EVIDENCE_DIR="../ux-audit-evidence" \
          CANDIDATE_SHA="${PRODUCT_SOURCE_SHA}" \
          ./node_modules/.bin/playwright test \
            ux-trust-01-audit.spec.cjs \
            --reporter=line \
            --output=../ux-audit-evidence/test-results

      - name: Upload UX audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-trust-01-full-app-audit-${{ github.sha }}
          path: ux-audit-evidence/
          if-no-files-found: error
          retention-days: 7
