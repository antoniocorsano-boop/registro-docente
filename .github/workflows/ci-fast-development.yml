# CI-FAST-01: bounded checks on STACKED development PRs only.
# Never replaces full main-targeted invariant, Chromium, Android or release gates.
name: CI-FAST-01 — Controlli rapidi di sviluppo

on:
  pull_request:
    branches-ignore: ['main']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-fast-01-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  targeted:
    name: Exact-SHA targeted contracts (not full qualification)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact development candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and base identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base "$BASE_SHA" "$CANDIDATE_SHA" >/dev/null
      - name: Check canonical invariant registry without installing dependencies
        run: node scripts/qualification/check-invariants.mjs
      - name: Compute exact-SHA inherited impact and fail closed on uncovered guarded paths
        run: |
          node scripts/qualification/impact.mjs "$BASE_SHA" "$CANDIDATE_SHA" --manifest ci-fast-impact.json
      - name: Select quick checks and identify release-risk escalation
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qualification/ci-fast-plan.mjs ci-fast-impact.json ci-fast-plan.json
          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("ci-fast-plan.json", "utf8"));
            const out = [
              "need_bun=" + String(p.needBun),
              "run_tests=" + String(p.checks.bunTests),
              "run_typecheck=" + String(p.checks.typecheck),
              "run_build=" + String(p.checks.build)
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out);
          '
      - name: Syntax-check modified qualification scripts
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const {execFileSync}=require("node:child_process");
            const p=require("./ci-fast-plan.json");
            for (const file of p.changedNodeScripts) execFileSync("node",["--check",file],{stdio:"inherit"});
          '
      - name: Set up Node 22 for native laboratory contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete F2 native laboratory Node contracts
        run: node scripts/diagnostics/run-native-lab-contracts.mjs
      - name: Set up Bun only when source or inherited contracts changed
        if: steps.plan.outputs.need_bun == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked application dependencies only if needed
        if: steps.plan.outputs.need_bun == 'true'
        run: bun install --frozen-lockfile
      - name: Run only selected inherited and changed unit contracts
        if: steps.plan.outputs.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(node -e '
            for (const file of require("./ci-fast-plan.json").testFiles) console.log(file);
          ')
          test "${#tests[@]}" -gt 0
          printf 'Fast selected tests:\n'
          printf ' - %s\n' "${tests[@]}"
          bun test "${tests[@]}"
      - name: Typecheck when application or typings changed
        if: steps.plan.outputs.run_typecheck == 'true'
        run: bun run lint
      - name: Build when application runtime changed
        if: steps.plan.outputs.run_build == 'true'
        run: bun run build
      - name: Document scope — never a full qualification
        if: always()
        shell: bash
        run: |
          {
            echo '### CI-FAST-01 — Sviluppo, non rilascio'
            echo
            echo "Candidato: \`$CANDIDATE_SHA\`"
            echo 'Le verifiche mirate non sostituiscono i controlli completi richiesti prima di integrare su main o distribuire Android.'
            if test -f ci-fast-plan.json; then
              node -e '
                const p=require("./ci-fast-plan.json");
                const s=p.escalation;
                console.log("Contratti selezionati: "+p.testFiles.length);
                console.log("Modifiche sensibili: "+s.highRiskPaths.length);
                console.log("Modifiche all interfaccia: "+s.browserRelatedPaths.length);
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo CI_FAST_NOT_FULL_QUALIFICATION
      - name: Preserve inspectable impact and fast plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-01-${{ env.CANDIDATE_SHA }}
          path: |
            ci-fast-impact.json
            ci-fast-plan.json
          if-no-files-found: warn
          retention-days: 7
