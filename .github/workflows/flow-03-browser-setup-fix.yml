name: FLOW-03 Browser Setup Fix

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-browser-setup-fix.mjs
      - .github/workflows/flow-03-browser-setup-fix.yml

permissions:
  contents: write

jobs:
  patch-browser-spec:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact staged candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact staged candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Apply fail-closed browser setup fix
        run: node scripts/flow03-browser-setup-fix.mjs

      - name: Validate spec syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser/flow-03-registra.spec.cjs
          git diff --check
          test "$(git diff --name-only)" = "tests/browser/flow-03-registra.spec.cjs"

      - name: Commit browser-spec-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/flow-03-registra.spec.cjs
          git diff --cached --check
          git commit -m "test: make FLOW-03 browser setup persistence-aware"
          git push origin HEAD:feat/flow-03-registra-orchestrator
