name: FLOW-03 Contract Qualification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  flow03-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "FLOW-03 candidate: ${CANDIDATE_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run FLOW-03 contracts individually
        shell: bash
        run: |
          set -euo pipefail
          for test_file in src/security/flow03*.test.ts; do
            echo "::group::${test_file}"
            bun test "${test_file}"
            echo "::endgroup::"
          done
