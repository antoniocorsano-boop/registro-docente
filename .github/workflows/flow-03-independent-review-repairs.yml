name: FLOW-03 Independent Review Repairs

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-independent-review-repairs.mjs
      - .github/workflows/flow-03-independent-review-repairs.yml
      - src/security/flow03RecordSessionContract.test.ts
      - src/security/flow03UdaDiaryHandoffContract.test.ts
      - src/security/homeNavigationDuringSaveIntegrity.test.ts

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact staged candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply fail-closed repairs
        run: node scripts/flow03-independent-review-repairs.mjs

      - name: Run FLOW-03 contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in src/security/flow03*.test.ts; do
            bun test "$test_file"
          done

      - name: Run security suite
        run: bun run test:security

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/recording/recordSession.ts src/persistence/submissionGradeImport.ts src/security/flow03AppIntegrationContract.test.ts
          git diff --cached --quiet && { echo "No repair delta to commit"; exit 1; }
          git commit -m "fix: close FLOW-03 independent review findings"
          git push origin HEAD:feat/flow-03-registra-orchestrator
