name: FLOW-03 Invariant Registration

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - .github/workflows/flow-03-invariant-registration.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Register repair contract fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'qualification/invariants.v1.json';
          let source = fs.readFileSync(path, 'utf8');
          const testPath = 'src/security/flow03IndependentReviewRepairs.test.ts';
          if (source.includes(testPath)) throw new Error('FLOW03_REPAIR_CONTRACT_ALREADY_REGISTERED');
          const impactNeedle = '        "src/security/flow03QualificationContract.test.ts",\n        "tests/browser/flow-02-conduci.spec.cjs",';
          const impactReplacement = '        "src/security/flow03QualificationContract.test.ts",\n        "src/security/flow03IndependentReviewRepairs.test.ts",\n        "tests/browser/flow-02-conduci.spec.cjs",';
          const testsNeedle = '        "src/security/flow03QualificationContract.test.ts",\n        "src/security/homeNavigationDuringSaveIntegrity.test.ts",';
          const testsReplacement = '        "src/security/flow03QualificationContract.test.ts",\n        "src/security/flow03IndependentReviewRepairs.test.ts",\n        "src/security/homeNavigationDuringSaveIntegrity.test.ts",';
          for (const [needle, replacement, label] of [
            [impactNeedle, impactReplacement, 'impactPaths'],
            [testsNeedle, testsReplacement, 'tests']
          ]) {
            const first = source.indexOf(needle);
            if (first < 0) throw new Error(`PATCH_MARKER_MISSING:${label}`);
            if (source.indexOf(needle, first + needle.length) >= 0) throw new Error(`PATCH_MARKER_AMBIGUOUS:${label}`);
            source = source.slice(0, first) + replacement + source.slice(first + needle.length);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Validate invariant registry
        run: bun scripts/qualification/check-invariants.mjs

      - name: Run invariant framework contract
        run: bun test src/security/qualificationInvariantFramework.test.ts

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- qualification/invariants.v1.json | grep -F 'flow03IndependentReviewRepairs.test.ts'

      - name: Commit registered invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualification/invariants.v1.json
          git diff --cached --quiet && { echo "No invariant delta to commit"; exit 1; }
          git commit -m "test: register FLOW-03 independent review repairs"
          git push origin HEAD:feat/flow-03-registra-orchestrator
