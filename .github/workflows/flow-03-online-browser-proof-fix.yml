name: FLOW-03 Online Browser Proof Fix

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-online-browser-proof-fix.mjs
      - .github/workflows/flow-03-online-browser-proof-fix.yml

permissions:
  contents: write

jobs:
  patch-browser-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact staged candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply fail-closed proof patch
        run: node scripts/flow03-online-browser-proof-fix.mjs

      - name: Validate browser spec
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser/flow-03-registra.spec.cjs
          git diff --check

      - name: Commit browser-proof-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/flow-03-registra.spec.cjs
          git diff --cached --quiet && { echo "No browser proof delta to commit"; exit 1; }
          git commit -m "test: verify FLOW-03 online class context across subtabs"
          git push origin HEAD:feat/flow-03-registra-orchestrator
