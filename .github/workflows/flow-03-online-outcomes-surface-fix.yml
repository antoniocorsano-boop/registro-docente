name: FLOW-03 Online Outcomes Surface Fix

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-online-outcomes-surface-fix.mjs
      - .github/workflows/flow-03-online-outcomes-surface-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact staged candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply fail-closed patch
        run: node scripts/flow03-online-outcomes-surface-fix.mjs

      - name: Run FLOW-03 contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in src/security/flow03*.test.ts; do
            bun test "${test_file}"
          done

      - name: Run full security suite
        run: bun run test:security

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VerificheOnlineView.tsx
          git diff --cached --quiet && { echo "No product delta to commit"; exit 1; }
          git commit -m "fix: open FLOW-03 online outcomes action surface"
          git push origin HEAD:feat/flow-03-registra-orchestrator
