name: FLOW-03 Task 5 Patch

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-task5-patch.mjs
      - .github/workflows/flow-03-task5-patch.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/flow-03-registra-orchestrator

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply fail-closed Task 5 patch
        run: bun scripts/flow03-task5-patch.mjs

      - name: Verify FLOW-03 contracts, security regression and typecheck
        shell: bash
        run: |
          set -euo pipefail
          for test_file in src/security/flow03*.test.ts; do
            bun test "${test_file}"
          done
          bun run test:security
          bun run lint
          git diff --check

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/flow03-task5-patch.mjs .github/workflows/flow-03-task5-patch.yml

      - name: Commit and push product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EvaluationsView.tsx src/App.tsx
          git diff --cached --check
          git commit -m "feat: prefill FLOW-03 evaluation context safely"
          git push origin "HEAD:${TARGET_BRANCH}"
