name: FLOW-03 Task 6 Patch

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-task6-patch.mjs
      - .github/workflows/flow-03-task6-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply fail-closed Task 6 patch
        run: node scripts/flow03-task6-patch.mjs

      - name: Run FLOW-03 contracts individually
        run: |
          for test_file in src/security/flow03*.test.ts; do
            bun test "$test_file"
          done

      - name: Run full security suite
        run: bun run test:security

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified product delta and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/flow03-task6-patch.mjs .github/workflows/flow-03-task6-patch.yml
          git add src/App.tsx src/components/UdaGanttView.tsx
          git commit -m "feat: hand FLOW-03 notes to authoritative UDA diary"
          git push origin HEAD:feat/flow-03-registra-orchestrator
