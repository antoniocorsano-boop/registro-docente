name: FLOW-03 Task 7 Patch

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator
    paths:
      - scripts/flow03-task7-patch.mjs
      - .github/workflows/flow-03-task7-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply fail-closed Task 7 patch
        run: node scripts/flow03-task7-patch.mjs

      - name: Validate browser spec syntax
        run: |
          node --check tests/browser/flow-02-conduci.spec.cjs
          node --check tests/browser/flow-03-registra.spec.cjs

      - name: Run FLOW-03 contracts individually
        run: |
          for test_file in src/security/flow03*.test.ts; do
            bun test "$test_file"
          done

      - name: Run full security suite
        run: bun run test:security

      - name: Validate invariant registry
        run: bun scripts/qualification/check-invariants.mjs

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified Task 7 delta and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/flow03-task7-patch.mjs .github/workflows/flow-03-task7-patch.yml
          git add \
            src/App.tsx \
            src/components/BehaviorsView.tsx \
            src/components/VerificheOnlineView.tsx \
            src/security/flow02BrowserQualificationContract.test.ts \
            tests/browser/flow-02-conduci.spec.cjs \
            tests/browser/flow-03-registra.spec.cjs \
            .github/workflows/browser-qualification.yml \
            qualification/invariants.v1.json
          git commit -m "feat: qualify FLOW-03 recording orchestration"
          git push origin HEAD:feat/flow-03-registra-orchestrator
