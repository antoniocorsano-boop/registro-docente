name: FLOW-02 Conduct Copilot Rework TDD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  focused-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Run FLOW-02 conduct Copilot UX contract
        run: bun test src/security/flow02ConductCopilotUxContract.test.ts
