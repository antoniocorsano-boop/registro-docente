name: FLOW-03 Human UX Apply Prepared Browser Patch

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore(flow-03): retry prepared Human UX browser patch' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03-registra-orchestrator
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply prepared browser patch and invariant mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prepared = Path('.github/workflows/flow03-human-ux-one-shot-browser.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          inv_path = Path('qualification/invariants.v1.json')\n"
          start = prepared.index(start_marker) + len(start_marker)
          end = prepared.index(end_marker, start)
          extracted = prepared[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          ) + '\n'
          exec(compile(script, '<prepared-flow03-browser-patch>', 'exec'))

          inv_path = Path('qualification/invariants.v1.json')
          inv = inv_path.read_text()

          component_anchor = '        "src/components/RecordLessonPanel.tsx",\n'
          if inv.count(component_anchor) != 1:
              raise SystemExit(f'RecordLessonPanel invariant anchor count {inv.count(component_anchor)}')
          inv = inv.replace(
              component_anchor,
              component_anchor + '        "src/components/RecordMissionBanner.tsx",\n',
              1
          )

          test_anchor = '        "src/security/flow03ManualUdaSelectionNoteContract.test.ts",\n'
          if inv.count(test_anchor) != 2:
              raise SystemExit(f'FLOW-03 manual UDA invariant anchor count {inv.count(test_anchor)}')
          additions = (
              test_anchor
              + '        "src/security/flow03MissionContinuityContract.test.ts",\n'
              + '        "src/security/flow03FocusedUdaWorkspaceContract.test.ts",\n'
              + '        "src/security/flow03FocusedUdaDiaryContract.test.ts",\n'
          )
          inv = inv.replace(test_anchor, additions)
          inv_path.write_text(inv)
          PY

      - name: Verify browser contract, syntax and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tests/browser/flow-03-registra.spec.cjs
          bun install --frozen-lockfile
          bun test src/security/flow03BrowserQualificationContract.test.ts
          bun run lint

      - name: Commit qualification delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/flow-03-registra.spec.cjs qualification/invariants.v1.json
          git commit -m "test(flow-03): qualify Human UX rework in browser"
          git push origin HEAD:feat/flow-03-registra-orchestrator
