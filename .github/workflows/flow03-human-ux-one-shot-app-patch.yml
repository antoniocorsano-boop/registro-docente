name: FLOW-03 Human UX One-shot App Patch

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore(flow-03): stage mission continuity app patch' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03-registra-orchestrator
          fetch-depth: 0

      - name: Apply bounded App patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          replacements = [
              (
                  "import { DashboardView } from './components/DashboardView';\n",
                  "import { DashboardView } from './components/DashboardView';\nimport { RecordMissionBanner } from './components/RecordMissionBanner';\n",
              ),
              (
                  "  const conductContext = currentClass\n"
                  "    ? resolveConductContext({\n"
                  "        className: currentClass.name,\n"
                  "        udas,\n"
                  "        todayIsoDate: today()\n"
                  "      })\n"
                  "    : null;\n"
                  "  const ambientCopilotSurface =\n",
                  "  const conductContext = currentClass\n"
                  "    ? resolveConductContext({\n"
                  "        className: currentClass.name,\n"
                  "        udas,\n"
                  "        todayIsoDate: today()\n"
                  "      })\n"
                  "    : null;\n"
                  "  const activeRecordMission =\n"
                  "    recordSession?.status === 'editing'\n"
                  "    && recordSession.context.classId === currentClass?.id\n"
                  "    && recordSession.evidenceKind\n"
                  "    && routeForRecordEvidence(recordSession.evidenceKind).tab === activeTab\n"
                  "      ? { ...recordSession, evidenceKind: recordSession.evidenceKind }\n"
                  "      : null;\n"
                  "  const ambientCopilotSurface =\n",
              ),
              (
                  "  const handleUpdateRecordStagedNote = useCallback((note: string) => {\n",
                  "  const handleReturnToRecord = useCallback(() => {\n"
                  "    const session = recordSessionRef.current;\n"
                  "    if (!session || session.status !== 'editing' || session.context.classId !== currentClassIdRef.current) return;\n"
                  "    recordSpecialistNavigationVersionRef.current = null;\n"
                  "    setTodayAction('record');\n"
                  "    setActiveTab('dashboard');\n"
                  "  }, [setActiveTab]);\n\n"
                  "  const handleUpdateRecordStagedNote = useCallback((note: string) => {\n",
              ),
              (
                  "        {/* TAB 3: Inserisci Valutazioni */}\n",
                  "        {activeRecordMission && (\n"
                  "          <RecordMissionBanner\n"
                  "            className={activeRecordMission.context.className}\n"
                  "            evidenceKind={activeRecordMission.evidenceKind}\n"
                  "            udaTitle={activeRecordMission.context.udaTitle}\n"
                  "            activityLabel={activeRecordMission.context.activityLabel}\n"
                  "            onReturn={handleReturnToRecord}\n"
                  "          />\n"
                  "        )}\n\n"
                  "        {/* TAB 3: Inserisci Valutazioni */}\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify exact diff and typecheck
        shell: bash
        run: |
          git diff --check
          git diff -- src/App.tsx
          bun install --frozen-lockfile
          bun run typecheck

      - name: Commit App patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat(flow-03): keep recording mission visible across specialists"
          git push origin HEAD:feat/flow-03-registra-orchestrator
