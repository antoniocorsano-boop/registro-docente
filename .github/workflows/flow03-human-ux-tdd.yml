name: FLOW-03 Human UX TDD

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Human UX rework contracts
        run: |
          set -euo pipefail
          files=(src/security/flow03MissionContinuityContract.test.ts)
          if [[ -f src/security/flow03FocusedUdaWorkspaceContract.test.ts ]]; then files+=(src/security/flow03FocusedUdaWorkspaceContract.test.ts); fi
          if [[ -f src/security/flow03FocusedUdaDiaryContract.test.ts ]]; then files+=(src/security/flow03FocusedUdaDiaryContract.test.ts); fi
          bun test "${files[@]}"
