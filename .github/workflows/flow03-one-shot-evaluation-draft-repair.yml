name: FLOW-03 One-shot Evaluation Draft Repair

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore(flow-03): run evaluation draft preservation repair' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03-registra-orchestrator
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repair
        run: python3 .github/flow03-evaluation-draft-repair.py

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow03EvaluationDraftPreservationContract.test.ts src/security/flow03IndependentReviewRepairs.test.ts src/security/flow03AppIntegrationContract.test.ts
          bun scripts/qualification/check-invariants.mjs
          bunx tsc --noEmit
          git diff --check

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/flow03-one-shot-evaluation-draft-repair.yml
          git rm .github/flow03-evaluation-draft-repair.py
          git add src/components/EvaluationsView.tsx qualification/invariants.v1.json
          git diff --cached --check
          git commit -m "fix(flow-03): preserve evaluation drafts across UDA updates"
          git push origin HEAD:feat/flow-03-registra-orchestrator
