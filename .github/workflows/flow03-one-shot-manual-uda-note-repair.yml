name: FLOW-03 One-shot Manual UDA Note Repair

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03-registra-orchestrator
          fetch-depth: 0

      - name: Apply exact FLOW-03 repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/UdaGanttView.tsx')
          text = path.read_text()

          old_pending = "      pendingRecordLessonFocusRef.current = false;"
          new_pending = "      pendingRecordLessonFocusRef.current = !recordLessonPrefill.udaId;"
          old_guard = "      selectedUdaForDetail.id !== recordLessonPrefill.udaId"
          new_guard = "      recordLessonPrefill.udaId && selectedUdaForDetail.id !== recordLessonPrefill.udaId"
          form_anchor = "    const form = recordLessonFormRef.current;"
          manual_draft = (
              "    if (!recordLessonPrefill.udaId) {\n"
              "      setNewLessonDate(recordLessonPrefill.date);\n"
              "      setNewLessonTopic(recordLessonPrefill.topic?.trim() || '');\n"
              "      setNewLessonNotes(recordLessonPrefill.notes?.trim() || '');\n"
              "    }\n\n"
              "    const form = recordLessonFormRef.current;"
          )

          checks = {
              'pending flag': text.count(old_pending),
              'selection guard': text.count(old_guard),
              'form anchor': text.count(form_anchor),
          }
          for label, count in checks.items():
              if count != 1:
                  raise SystemExit(f'expected one {label}, found {count}')

          text = text.replace(old_pending, new_pending, 1)
          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(form_anchor, manual_draft, 1)
          path.write_text(text)
          PY

      - name: Verify exact diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/UdaGanttView.tsx

      - name: Commit exact repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UdaGanttView.tsx
          git commit -m "fix(flow-03): preserve staged note after manual UDA selection"
          git push origin HEAD:feat/flow-03-registra-orchestrator
