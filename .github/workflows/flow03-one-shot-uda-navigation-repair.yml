name: FLOW-03 One-shot UDA Navigation Repair

on:
  push:
    branches:
      - feat/flow-03-registra-orchestrator

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03-registra-orchestrator
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply fail-closed UDA navigation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          old = """    const shouldPreserveRecordSession =
      options.preserveRecordSession
      || (
        recordSessionRef.current?.status === 'editing'
        && recordSessionRef.current.evidenceKind === 'lesson-log'
      );"""
          new = """    const shouldPreserveRecordSession = Boolean(options.preserveRecordSession);"""
          if app.count(old) != 1:
              raise SystemExit(f'App navigation anchor cardinality != 1: {app.count(old)}')
          app_path.write_text(app.replace(old, new, 1))

          spec_path = Path('tests/browser/flow-03-registra.spec.cjs')
          spec = spec_path.read_text()
          anchor = """// Conduci → Registra → diario UDA
// Registra → Comportamento
// Registra → Esiti verifica online
test.describe('FLOW-03 mobile qualification', () => {"""
          regression = """test.describe('FLOW-03 ordinary UDA navigation invalidation qualification', () => {
  test.use({ viewport: { width: 1280, height: 900 } });

  test('ordinary navigation after closing focused UDA does not resurrect the recording mission', async ({ page }) => {
  const pageErrors = installPageErrorCollector(page);
  await prepareScenario(page, 'flow-03-uda-ordinary-navigation');

  const record = await openRecordFromOggi(page);
  await record.getByLabel('Nota di sessione', { exact: true }).fill(RAPID_NOTE);
  await record.getByRole('button', { name: 'Attività / nota UDA', exact: true }).click();
  const mission = await assertRecordMission(page, 'Attività / nota UDA');
  const chooser = page.getByRole('region', { name: 'Seleziona UDA per Registra' });
  await expect(chooser).toBeVisible();
  await chooser.getByRole('button', { name: 'Scegli questa UDA', exact: true }).click();
  await expect(page.getByText('Registrazione rapida', { exact: true })).toBeVisible();

  await page.getByRole('button', { name: 'Chiudi Fascicolo', exact: true }).click();
  await expect(page.getByText('Registrazione rapida', { exact: true })).toBeHidden();

  await page.getByRole('button', { name: 'Menu', exact: true }).click();
  const drawer = page.getByRole('complementary');
  await drawer.getByRole('button', { name: 'Storico prove', exact: true }).click();
  await expect(mission).toBeHidden();
  await expect(page.getByRole('heading', { name: `Storico Prove Registrate: ${CLASS_NAME}` })).toBeVisible();

  await page.getByRole('button', { name: 'Menu', exact: true }).click();
  await drawer.getByRole('button', { name: 'UDA', exact: true }).click();
  await expect(page.getByRole('heading', { name: 'Unità didattiche', exact: true })).toBeVisible();
  await expect(page.getByRole('region', { name: `Missione Registra per ${CLASS_NAME}` })).toBeHidden();
  await expect(page.getByText('Registrazione rapida', { exact: true })).toBeHidden();
  await expect(page.getByRole('group', { name: 'Viste UDA' })).toBeVisible();
  await page.screenshot({ path: evidencePath('flow-03-desktop-uda-ordinary-return.png'), fullPage: true });
  expect(pageErrors).toEqual([]);
});
});

// Conduci → Registra → diario UDA
// Registra → Comportamento
// Registra → Esiti verifica online
test.describe('FLOW-03 mobile qualification', () => {"""
          if spec.count(anchor) != 1:
              raise SystemExit(f'Browser insertion anchor cardinality != 1: {spec.count(anchor)}')
          spec_path.write_text(spec.replace(anchor, regression, 1))

          contract_path = Path('src/security/flow03OrdinaryUdaNavigationInvalidationContract.test.ts')
          contract = contract_path.read_text()
          old_contract = """    expect(handler).toContain('publishRecordSession(null)');
  });
});
"""
          new_contract = """    expect(handler).toContain('publishRecordSession(null)');

    const browser = await source('tests/browser/flow-03-registra.spec.cjs');
    expect(browser).toContain('ordinary navigation after closing focused UDA does not resurrect the recording mission');
    expect(browser).toContain("flow-03-desktop-uda-ordinary-return.png");
    expect(browser).toContain("getByRole('button', { name: 'Storico prove', exact: true })");
    expect(browser).toContain("getByRole('button', { name: 'UDA', exact: true })");
  });
});
"""
          if contract.count(old_contract) != 1:
              raise SystemExit(f'Contract anchor cardinality != 1: {contract.count(old_contract)}')
          contract_path.write_text(contract.replace(old_contract, new_contract, 1))
          PY

      - name: Verify targeted GREEN and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            src/security/flow03OrdinaryUdaNavigationInvalidationContract.test.ts \
            src/security/flow03MissionContinuityContract.test.ts \
            src/security/flow03IndependentReviewRepairs.test.ts \
            src/security/flow03BrowserQualificationContract.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit repair and remove one-shot harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03-one-shot-uda-navigation-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(flow-03): invalidate UDA session on ordinary navigation'
          git push origin HEAD:feat/flow-03-registra-orchestrator
