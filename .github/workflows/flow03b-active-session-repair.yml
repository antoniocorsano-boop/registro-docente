name: FLOW-03B Active Session Repair

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-active-session-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply active-session repair
        run: python3 scripts/flow03b-active-session-repair.py

      - name: Verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow03bActiveRecordFocusContract.test.ts
          bun test src/security/flow03*.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit verified repair and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-active-session-repair.yml scripts/flow03b-active-session-repair.py
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add -A
          git commit -m "fix(flow-03b): focus unsaved same-class Registra sessions"
          git push origin HEAD:feat/flow-03b-post-record-ux
