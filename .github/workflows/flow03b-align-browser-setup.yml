name: FLOW-03B Browser Setup Alignment

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-align-browser-setup.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align browser setup helpers
        run: python3 scripts/flow03b-align-browser-setup.py

      - name: Verify alignment
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser/today-01-home-oggi-router.spec.cjs
          node --check tests/browser/flow-01-prepara.spec.cjs
          node --check tests/browser/flow-02-conduci.spec.cjs
          bun test src/security/flow03*.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit verified alignment and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-align-browser-setup.yml scripts/flow03b-align-browser-setup.py
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add -A
          git commit -m "test(flow-03b): decouple browser setup from backup reminder"
          git push origin HEAD:feat/flow-03b-post-record-ux
