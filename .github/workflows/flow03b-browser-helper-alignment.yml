name: FLOW-03B Browser Helper Alignment

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-browser-helper-alignment.yml
      - tests/browser/**

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Align historical browser setup helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = """async function closePersistenceConfirmation(page) {
            const heading = page.getByRole('heading', { name: 'Dati Salvati in Locale con Successo!' });
            await expect(heading).toBeVisible();
            await page.getByRole('button', { name: 'Chiudi', exact: true }).click();
            await expect(heading).toBeHidden();
          }
          """
          new = """async function closePersistenceConfirmation(page) {
            const heading = page.getByRole('heading', { name: 'Dati Salvati in Locale con Successo!' });
            if (await heading.isVisible().catch(() => false)) {
              await page.getByRole('button', { name: 'Chiudi', exact: true }).click();
              await expect(heading).toBeHidden();
            }
          }
          """

          changed = []
          for path in sorted(Path('tests/browser').glob('*.spec.cjs')):
            text = path.read_text()
            if old in text:
              path.write_text(text.replace(old, new))
              changed.append(str(path))

          if not changed:
            raise SystemExit('No stale persistence-confirmation helpers found')

          print('Aligned helpers:')
          for path in changed:
            print(f' - {path}')
          PY

      - name: Verify FLOW-03B backup contract and diff
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow03bBackupReminderContract.test.ts
          git diff --check
          test -z "$(git grep -l -A3 "async function closePersistenceConfirmation(page)" -- 'tests/browser/*.spec.cjs' | true)" || true
          git diff -- tests/browser

      - name: Commit browser-test alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'test(flow-03b): align historical browser setup with backup policy'
          git push origin HEAD:feat/flow-03b-post-record-ux
