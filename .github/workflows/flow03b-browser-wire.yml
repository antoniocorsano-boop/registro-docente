name: FLOW-03B Browser Integrate

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-browser-wire.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate FLOW-03B evidence into canonical FLOW-03 browser journey
        run: python3 scripts/flow03b-browser-integrate.py

      - name: Verify source contracts and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow03*.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit verified browser integration and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-browser-wire.yml scripts/flow03b-browser-integrate.py
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add -A
          git commit -m "test(flow-03b): extend canonical browser qualification"
          git push origin HEAD:feat/flow-03b-post-record-ux
