name: FLOW-03B Class Switch Browser Regression

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-class-switch-browser-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Patch FLOW-03 browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/flow-03-registra.spec.cjs')
          text = path.read_text()

          old_const = "const CLASS_NAME = '2C Sintetica FLOW-03';\n"
          new_const = "const CLASS_NAME = '2C Sintetica FLOW-03';\nconst SECOND_CLASS_NAME = '3D Sintetica FLOW-03B';\n"
          if text.count(old_const) != 1:
              raise SystemExit(f'CLASS_NAME anchor count: {text.count(old_const)}')
          text = text.replace(old_const, new_const)

          old_setup = "  await prepareScenario(page, 'flow-03-mobile');\n\n  const conduct = await openConductFromOggi(page);\n"
          new_setup = "  await prepareScenario(page, 'flow-03-mobile');\n\n  page.once('dialog', dialog => dialog.accept(SECOND_CLASS_NAME));\n  await page.getByRole('button', { name: /Nuova Classe/ }).click();\n  await expect(page.getByRole('heading', { name: `Gestione Elenco Alunni: ${SECOND_CLASS_NAME}` })).toBeVisible();\n  await closePersistenceConfirmationIfPresent(page);\n  await openOggiFromDrawer(page);\n\n  const conduct = await openConductFromOggi(page);\n"
          if text.count(old_setup) != 1:
              raise SystemExit(f'mobile setup anchor count: {text.count(old_setup)}')
          text = text.replace(old_setup, new_setup)

          old_review = """  expect(flow03bReviewLabels).toEqual(['UDA e diario', 'Tabellone', 'Analisi', 'Storico']);
  await page.screenshot({ path: evidencePath('flow-03-mobile-review.png'), fullPage: true });

  await openOggiFromDrawer(page);
"""
          new_review = """  expect(flow03bReviewLabels).toEqual(['UDA e diario', 'Tabellone', 'Analisi', 'Storico']);
  await page.screenshot({ path: evidencePath('flow-03-mobile-review.png'), fullPage: true });

  const classSwitcher = page.locator('select[title="Cambia rapidamente classe attiva"]');
  await expect(classSwitcher).toBeVisible();
  await classSwitcher.selectOption({ label: SECOND_CLASS_NAME });
  await expect.poll(() => classSwitcher.evaluate(select => select.selectedOptions[0]?.textContent?.trim() ?? '')).toBe(SECOND_CLASS_NAME);
  await expect(review).toContainText('Prima destinazione consigliata: Tabellone.');
  const switchedReviewLabels = (await review.locator('button').allTextContents())
    .map(label => label.trim())
    .filter(label => ['UDA e diario', 'Tabellone', 'Analisi', 'Storico', 'Scheda alunno'].includes(label));
  expect(switchedReviewLabels).toEqual(['Tabellone', 'Analisi', 'Storico', 'Scheda alunno']);
  await page.screenshot({ path: evidencePath('flow-03b-mobile-review-class-switch.png'), fullPage: true });

  await openOggiFromDrawer(page);
"""
          if text.count(old_review) != 1:
              raise SystemExit(f'mobile review anchor count: {text.count(old_review)}')
          path.write_text(text.replace(old_review, new_review))
          PY

      - name: Verify browser source
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser/flow-03-registra.spec.cjs
          git diff --check
          grep -F "flow-03b-mobile-review-class-switch.png" tests/browser/flow-03-registra.spec.cjs
          grep -F "setReviewEvidenceKind(null);" src/App.tsx

      - name: Commit regression and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-class-switch-browser-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/flow-03-registra.spec.cjs .github/workflows/flow03b-class-switch-browser-regression.yml
          git commit -m 'test(flow-03b): cover review context class switch'
          git push origin HEAD:feat/flow-03b-post-record-ux
