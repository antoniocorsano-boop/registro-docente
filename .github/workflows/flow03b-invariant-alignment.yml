name: FLOW-03B Invariant Alignment

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-invariant-alignment.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply contract and invariant alignment
        run: python3 scripts/flow03b-invariant-alignment.py

      - name: Verify aligned inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow02AppIntegrationContract.test.ts src/security/flow01PreparationUiContract.test.ts src/security/today01ContinuationContract.test.ts
          bun test src/security/flow03*.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit verified alignment and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-invariant-alignment.yml scripts/flow03b-invariant-alignment.py
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add -A
          git commit -m "test(flow-03b): align inherited contracts and invariants"
          git push origin HEAD:feat/flow-03b-post-record-ux
