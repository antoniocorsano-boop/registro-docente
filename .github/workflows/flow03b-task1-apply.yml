name: FLOW-03B Task 1 Apply

on:
  push:
    branches:
      - feat/flow-03b-post-record-ux
    paths:
      - .github/workflows/flow03b-task1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-03b-post-record-ux
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply guarded Task 1 repair
        run: python3 scripts/flow03b-task1-apply.py

      - name: Verify Task 1 GREEN
        shell: bash
        run: |
          set -euo pipefail
          bun test src/security/flow03bBackupReminderContract.test.ts
          bun test src/security/flow03*.test.ts
          bunx tsc --noEmit
          git diff --check

      - name: Commit verified Task 1 and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/flow03b-task1-apply.yml scripts/flow03b-task1-apply.py
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add -A
          git commit -m "feat(flow-03b): gate backup reminder by attention checkpoints"
          git push origin HEAD:feat/flow-03b-post-record-ux
