name: FLOW-04 P1 browser regression repair

on:
  push:
    branches:
      - feat/flow-04-review-session

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply FLOW-04 specialist browser regression' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/flow-04-review-session
          fetch-depth: 1

      - name: Apply guarded browser regression
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/browser/flow-04-review-session.spec.cjs')
          text = path.read_text()

          old_setup = "    await createSyntheticClass(page, CLASS_NAME);"
          if text.count(old_setup) < 2:
              raise SystemExit(f'expected desktop and mobile class setup markers, found {text.count(old_setup)}')
          text = text.replace(old_setup, "    await createSyntheticClass(page, CLASS_NAME, { withStudent: true });", 1)

          old_tabellone = "\n".join([
              "    await page.screenshot({ path: evidencePath('flow-04-desktop-tabellone.png'), fullPage: true });",
              "",
              "    await banner.getByRole('button', { name: 'Torna a Rivedi', exact: true }).click();"
          ])
          new_tabellone = "\n".join([
              "    await page.screenshot({ path: evidencePath('flow-04-desktop-tabellone.png'), fullPage: true });",
              "",
              "    // specialist-to-specialist keeps review mission even when the specialist view calls setActiveTab directly.",
              "    await page.getByText(STUDENT_NAME, { exact: true }).click();",
              "    banner = await reviewMission(page);",
              "    await expect(banner).toContainText('Superficie corrente: Scheda alunno');",
              "    await page.screenshot({ path: evidencePath('flow-04-desktop-report-from-tabellone.png'), fullPage: true });",
              "",
              "    await banner.getByRole('button', { name: 'Torna a Rivedi', exact: true }).click();"
          ])
          if text.count(old_tabellone) != 1:
              raise SystemExit(f'tabellone insertion anchor expected once, found {text.count(old_tabellone)}')
          text = text.replace(old_tabellone, new_tabellone, 1)

          old_exit_anchor = "\n".join([
              "    await review.getByRole('button', { name: 'Chiudi la sessione Rivedi' }).click();",
              "    await expect(review).toBeHidden();",
              "    await expect(page.locator('[data-testid=\"flow03b-class-overview\"]')).toHaveJSProperty('open', true);",
              "",
              "    // non-review navigation closes the mission instead of carrying it into an unrelated task."
          ])
          new_exit_anchor = "\n".join([
              "    await review.getByRole('button', { name: 'Chiudi la sessione Rivedi' }).click();",
              "    await expect(review).toBeHidden();",
              "    await expect(page.locator('[data-testid=\"flow03b-class-overview\"]')).toHaveJSProperty('open', true);",
              "",
              "    // specialist exit closes review mission when Storico opens the non-review evaluation editor directly.",
              "    await openOggiFromDrawer(page);",
              "    review = await openReviewFromOggi(page, CLASS_NAME);",
              "    await reviewOption(review, 'Storico').click();",
              "    banner = await reviewMission(page);",
              "    await expect(banner).toContainText('Superficie corrente: Storico');",
              "    await page.getByRole('button', { name: /Nuova Valutazione/ }).click();",
              "    await expect(page.getByRole('heading', { name: 'Nuova Valutazione di Classe' })).toBeVisible();",
              "    await expect(banner).toBeHidden();",
              "",
              "    // non-review navigation closes the mission instead of carrying it into an unrelated task."
          ])
          if text.count(old_exit_anchor) != 1:
              raise SystemExit(f'specialist-exit anchor expected once, found {text.count(old_exit_anchor)}')
          text = text.replace(old_exit_anchor, new_exit_anchor, 1)

          path.write_text(text)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify browser regression contract
        run: |
          bun test src/security/flow04BrowserQualificationContract.test.ts
          node --check tests/browser/flow-04-review-session.spec.cjs

      - name: Commit browser regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/flow-04-review-session.spec.cjs
          git diff --cached --check
          git commit -m 'test: cover FLOW-04 specialist navigation lifecycle in Chromium'
          git push origin HEAD:feat/flow-04-review-session
