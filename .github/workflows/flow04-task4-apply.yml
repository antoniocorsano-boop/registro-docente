name: FLOW-04 Task 4 guarded manifest
# Trigger-only workflow: self-removes after a qualified manifest commit.

on:
  push:
    branches:
      - feat/flow-04-review-session

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply FLOW-04 task4 manifest' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout FLOW-04 branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-04-review-session
          fetch-depth: 1

      - name: Register FLOW-04 invariant exactly once
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('qualification/invariants.v1.json')
          data = json.loads(path.read_text())
          invariants = data.get('invariants')
          if not isinstance(invariants, list):
              raise SystemExit('qualification/invariants.v1.json: invariants must be a list')

          existing = [item for item in invariants if item.get('id') == 'FLOW-04-I01']
          if existing:
              raise SystemExit(f'FLOW-04-I01 already exists ({len(existing)})')

          invariants.append({
              'id': 'FLOW-04-I01',
              'owner': 'FLOW-04',
              'statement': 'Rivedi is a session-only professional review orchestrator that preserves explicit class and review mission across existing authoritative surfaces, remains non-persistent and descriptive, never decides or auto-writes professional outcomes, and fails closed across class or review-boundary changes.',
              'impactPaths': [
                  'qualification/invariants.v1.json',
                  'src/App.tsx',
                  'src/review/',
                  'src/components/DashboardView.tsx',
                  'src/components/ReviewRouterPanel.tsx',
                  'src/components/ReviewMissionBanner.tsx',
                  'src/recording/reviewRouting.ts',
                  'src/security/flow04ReviewSessionContract.test.ts',
                  'src/security/flow04ReviewUiContract.test.ts',
                  'src/security/flow04PersistenceBoundary.test.ts',
                  'src/security/flow03bContextualReviewContract.test.ts',
                  'src/security/today01ContinuationContract.test.ts',
                  'src/security/today01SessionContextContract.test.ts'
              ],
              'tests': [
                  'src/security/flow04ReviewSessionContract.test.ts',
                  'src/security/flow04ReviewUiContract.test.ts',
                  'src/security/flow04PersistenceBoundary.test.ts',
                  'src/security/flow03bContextualReviewContract.test.ts',
                  'src/security/today01ContinuationContract.test.ts',
                  'src/security/today01SessionContextContract.test.ts'
              ]
          })

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify FLOW-04 persistence and invariant contracts
        run: |
          bun test \
            src/security/flow04PersistenceBoundary.test.ts \
            src/security/flow04ReviewSessionContract.test.ts \
            src/security/flow04ReviewUiContract.test.ts \
            src/security/flow03bContextualReviewContract.test.ts \
            src/security/today01ContinuationContract.test.ts \
            src/security/today01SessionContextContract.test.ts
          bun scripts/qualification/check-invariants.mjs
          bun run test:security
          bun run lint
          bun run build

      - name: Commit qualified Task 4 manifest and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/flow04-task4-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/invariants.v1.json .github/workflows/flow04-task4-apply.yml
          git diff --cached --check
          git commit -m 'test: qualify FLOW-04 review session boundaries'
          git push origin HEAD:feat/flow-04-review-session
