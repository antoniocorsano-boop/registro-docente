name: FLOW-04 Task 5 guarded browser registration

on:
  push:
    branches:
      - feat/flow-04-review-session

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply FLOW-04 task5 browser registration' }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout FLOW-04 branch
        uses: actions/checkout@v4
        with:
          ref: feat/flow-04-review-session
          fetch-depth: 1

      - name: Apply guarded browser and invariant registration
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(path_string, old, new):
              path = Path(path_string)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_string}: expected one marker, found {count}: {old}')
              path.write_text(text.replace(old, new, 1))

          today = 'tests/browser/today-01-home-oggi-router.spec.cjs'
          replace_once(today, "page.getByRole('region', { name: 'Continua: Rivedi' })", "page.getByRole('region', { name: `Rivedi la classe ${CLASS_NAME}` })")
          replace_once(today, "continuation.getByRole('button', { name: label, exact: true })", "continuation.getByRole('button', { name: new RegExp(`^${label}`) })")
          replace_once(today, "continuation.getByRole('button', { name: 'Chiudi continuazione di oggi' })", "continuation.getByRole('button', { name: 'Chiudi la sessione Rivedi' })")

          flow03_path = Path('tests/browser/flow-03-registra.spec.cjs')
          flow03 = flow03_path.read_text()
          old_region = "const review = page.getByRole('region', { name: 'Continua: Rivedi' });"
          new_region = "const review = page.getByRole('region', { name: `Rivedi la classe ${CLASS_NAME}` });"
          if flow03.count(old_region) != 1:
              raise SystemExit(f'FLOW-03 browser: old review region expected once, found {flow03.count(old_region)}')
          flow03 = flow03.replace(old_region, new_region, 1)
          old_copy = "await expect(review).toContainText('Prima destinazione consigliata: Tabellone.');"
          new_copy = "await expect(review).toContainText(\"L'ordine delle superfici riflette il tipo di evidenza appena registrata\");"
          if flow03.count(old_copy) != 1:
              raise SystemExit(f'FLOW-03 browser: old review copy expected once, found {flow03.count(old_copy)}')
          flow03 = flow03.replace(old_copy, new_copy, 1)
          pattern = re.compile(r"    const labels = \(await review\.locator\('button'\)\.allTextContents\(\)\)\n      \.map\(label => label\.trim\(\)\)\n      \.filter\(label => \['Tabellone', 'Analisi', 'Storico', 'Scheda alunno'\]\.includes\(label\)\);\n    expect\(labels\)\.toEqual\(\['Tabellone', 'Analisi', 'Storico', 'Scheda alunno'\]\);", re.M)
          replacement = "\n".join([
              "    const expectedReviewOrder = ['Tabellone', 'Analisi', 'Storico', 'Scheda alunno'];",
              "    const positionedReviewOptions = [];",
              "    for (const label of expectedReviewOrder) {",
              "      const option = review.getByRole('button', { name: new RegExp(`^${label}`) });",
              "      await expect(option).toBeVisible();",
              "      const box = await option.boundingBox();",
              "      expect(box).not.toBeNull();",
              "      positionedReviewOptions.push({ label, y: box.y });",
              "    }",
              "    expect(positionedReviewOptions.sort((a, b) => a.y - b.y).map(item => item.label)).toEqual(expectedReviewOrder);"
          ])
          flow03, substitutions = pattern.subn(replacement, flow03, count=1)
          if substitutions != 1:
              raise SystemExit(f'FLOW-03 browser: ordering block expected once, found {substitutions}')
          flow03_path.write_text(flow03)

          workflow_path = Path('.github/workflows/browser-qualification.yml')
          workflow = workflow_path.read_text()
          copy_anchor = "          cp tests/browser/flow-03-registra.spec.cjs .browser-tools/flow-03-registra.spec.cjs\n"
          if workflow.count(copy_anchor) != 1:
              raise SystemExit(f'browser workflow: FLOW-03 copy anchor expected once, found {workflow.count(copy_anchor)}')
          if 'cp tests/browser/flow-04-review-session.spec.cjs' in workflow:
              raise SystemExit('browser workflow: FLOW-04 copy already registered')
          workflow = workflow.replace(copy_anchor, copy_anchor + "          cp tests/browser/flow-04-review-session.spec.cjs .browser-tools/flow-04-review-session.spec.cjs\n", 1)

          next_step = "      - name: Run LSM-01C consumer Chromium qualification\n"
          if workflow.count(next_step) != 1:
              raise SystemExit(f'browser workflow: LSM next-step anchor expected once, found {workflow.count(next_step)}')
          if 'name: Run FLOW-04 Chromium qualification' in workflow:
              raise SystemExit('browser workflow: FLOW-04 run already registered')
          flow04_lines = [
              "      - name: Run FLOW-04 Chromium qualification",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          cd .browser-tools",
              "          BASE_URL=\"http://127.0.0.1:${PORT}\" \\",
              "          EVIDENCE_DIR=\"../browser-evidence\" \\",
              "          CANDIDATE_SHA=\"${CANDIDATE_SHA}\" \\",
              "          ./node_modules/.bin/playwright test \\",
              "            flow-04-review-session.spec.cjs \\",
              "            --workers=1 \\",
              "            --reporter=line \\",
              "            --output=../browser-evidence/flow-04-test-results",
              "",
          ]
          workflow = workflow.replace(next_step, "\n".join(flow04_lines) + next_step, 1)
          workflow_path.write_text(workflow)

          registry_path = Path('qualification/invariants.v1.json')
          registry = json.loads(registry_path.read_text())
          matches = [item for item in registry.get('invariants', []) if item.get('id') == 'FLOW-04-I01']
          if len(matches) != 1:
              raise SystemExit(f'FLOW-04-I01 expected exactly once, found {len(matches)}')
          invariant = matches[0]
          for impact in [
              '.github/workflows/browser-qualification.yml',
              'tests/browser/flow-04-review-session.spec.cjs',
              'src/security/flow04BrowserQualificationContract.test.ts'
          ]:
              if impact not in invariant['impactPaths']:
                  invariant['impactPaths'].append(impact)
          browser_contract = 'src/security/flow04BrowserQualificationContract.test.ts'
          if browser_contract not in invariant['tests']:
              invariant['tests'].append(browser_contract)
          browser_spec = 'tests/browser/flow-04-review-session.spec.cjs'
          browser_smoke = invariant.setdefault('browserSmoke', [])
          if browser_spec not in browser_smoke:
              browser_smoke.append(browser_spec)
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify FLOW-04 Task 5 registration
        run: |
          bun test src/security/flow04BrowserQualificationContract.test.ts
          bun scripts/qualification/check-invariants.mjs
          bun run test:security
          bun run lint
          bun run build

      - name: Commit qualified Task 5 registration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/flow04-task5-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/browser-qualification.yml \
            qualification/invariants.v1.json \
            tests/browser/today-01-home-oggi-router.spec.cjs \
            tests/browser/flow-03-registra.spec.cjs \
            .github/workflows/flow04-task5-apply.yml
          git diff --cached --check
          git commit -m 'test: register FLOW-04 browser qualification'
          git push origin HEAD:feat/flow-04-review-session
