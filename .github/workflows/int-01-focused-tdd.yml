name: INT-01 Focused TDD
on:
  pull_request:
    paths:
      - 'src/planning/**'
      - 'src/context/**'
      - 'src/App.tsx'
      - 'src/components/**'
      - 'src/library/planningContextBridge*'
      - 'src/security/int01*.test.ts'
      - '.github/workflows/int-01-focused-tdd.yml'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: INT-01 contracts
        run: bun test src/security/int01PlanningFrameContract.test.ts src/library/planningContextBridge.test.ts src/security/int01TeachingFocusContract.test.ts src/security/int01ProfessionalContextContract.test.ts src/security/int01AppContextContract.test.ts src/security/int01DidacticContinuityUiContract.test.ts
