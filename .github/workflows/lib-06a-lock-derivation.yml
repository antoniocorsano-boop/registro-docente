name: LIB-06A Lock Derivation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  derive:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Derive lockfile without installing packages
        run: bun install --lockfile-only

      - name: Show exact lockfile delta
        run: git diff -- bun.lock

      - name: Commit only the derived lock when needed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock
          test "$(git diff --cached --name-only)" = "bun.lock"
          git commit -m "build: sync Bun lock for local intent adapter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
