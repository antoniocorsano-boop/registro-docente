name: LIB-01B Lockfile Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Materialize lockfile only
        run: bun install --lockfile-only
      - name: Commit deterministic bun.lock delta
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already materialized"
            exit 0
          fi
          git diff -- bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: materialize contextual core local dependency lock"
          git push origin HEAD:${{ github.head_ref }}
