name: LIB-01C test contract materializer

on:
  push:
    branches:
      - feat/lib-01c-teaching-context
    paths:
      - .github/workflows/lib01c-test-contract-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lib-01c-teaching-context
          fetch-depth: 0

      - name: Update obsolete source-level contract only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/security/lib01cTeachingContextContract.test.ts')
          text = p.read_text()
          old = """  test('progressively discloses explicit UDA/lesson context and derives the vertical link target from it', () => {\n    const cardSource = readFileSync(new URL('../components/LibrarySourceCard.tsx', import.meta.url), 'utf8');\n\n    expect(cardSource).toContain('resolveLibraryTeachingContext');\n    expect(cardSource).toContain('Contesto di lavoro');\n    expect(cardSource).toContain('UDA corrente');\n    expect(cardSource).toContain('Lezione corrente');\n    expect(cardSource).toContain('Tipo di attività');\n    expect(cardSource).toContain(\"setContextLessonId('')\");\n    expect(cardSource).toContain('resolveLibraryContextActions(source, resolvedTeachingContext)');\n    expect(cardSource).toContain('teachingContext: resolvedTeachingContext');\n    expect(cardSource).toContain(\"targetType: 'lesson'\");\n    expect(cardSource).toContain(\"targetType: 'uda'\");\n    expect(cardSource).not.toContain('UDA di destinazione');\n  });\n"""
          new = """  test('wires deterministic suggestion and teacher override into the governed vertical link target', () => {\n    const cardSource = readFileSync(new URL('../components/LibrarySourceCard.tsx', import.meta.url), 'utf8');\n\n    expect(cardSource).toContain('resolveLibraryTeachingContext');\n    expect(cardSource).toContain('suggestLibraryTeachingContext');\n    expect(cardSource).toContain('onExplicitTeachingContextChange');\n    expect(cardSource).toContain(\"setContextLessonId('')\");\n    expect(cardSource).toContain('setContextLinkConfirmationPending(false)');\n    expect(cardSource).toContain('resolveLibraryContextActions(source, resolvedTeachingContext)');\n    expect(cardSource).toContain('teachingContext: resolvedTeachingContext');\n    expect(cardSource).toContain(\"targetType: 'lesson'\");\n    expect(cardSource).toContain(\"targetType: 'uda'\");\n    expect(cardSource).not.toContain('UDA di destinazione');\n  });\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected obsolete block exactly once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/lib01c-test-contract-materializer.yml

      - name: Commit test-only correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security/lib01cTeachingContextContract.test.ts .github/workflows/lib01c-test-contract-materializer.yml
          git commit -m "test: align LIB-01C wiring contract with suggestion UX"
          git push origin HEAD:feat/lib-01c-teaching-context
