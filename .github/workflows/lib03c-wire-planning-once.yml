name: LIB-03C one-shot App wiring

on:
  push:
    branches:
      - feat/lib-03c-progressive-ux

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/lib-03c-progressive-ux
          fetch-depth: 0

      - name: Apply exact planning prop and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "            udas={udas}\n            currentClassName={currentClass?.name ?? null}"
          new = "            udas={udas}\n            planning={planning}\n            currentClassName={currentClass?.name ?? null}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'LIB-03C exact App wiring expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/lib03c-wire-planning-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --check
          git commit -m 'feat(lib-03c): wire planning into library'
          git push origin HEAD:feat/lib-03c-progressive-ux
