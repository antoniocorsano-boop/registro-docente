name: MOBILE-01 Android Packaging Probe

on:
  pull_request:
    paths:
      - 'mobile/android-probe/**'
      - '.github/workflows/mobile-01-android-probe.yml'
      - 'docs/superpowers/specs/2026-11-11-mobile-01-android-apk-probe-design.md'
      - 'docs/superpowers/plans/2026-11-11-mobile-01-android-apk-probe.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROBE_DIR: mobile/android-probe
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Source SHA: %s\n' "$SOURCE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build existing web frontend without altering lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test src/security/navAndroid01NativeBackContract.test.ts
          bun run build
          test -f dist/index.html
          test -s dist/vendor/html2pdf.bundle.min.js
          test -s dist/vendor/html2pdf.bundle.min.js.LICENSE.txt
          test -s dist/assets/DejaVu-LICENSE.txt
          test -n "$(find dist/assets -name 'DejaVuSans-*.ttf' -print -quit)"
          test -n "$(find dist/assets -name 'DejaVuSans-Bold-*.ttf' -print -quit)"
          grep -lF -- '--safe-area-inset-top' dist/assets/*.css
          grep -lF -- 'class-card-manage' dist/assets/*.js
          grep -F '/vendor/html2pdf.bundle.min.js' dist/index.html
          if grep -E 'fonts.googleapis.com|fonts.gstatic.com|cdnjs.cloudflare.com' dist/index.html; then
            echo 'ERROR: Required PDF/fonts still load from a remote site'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install isolated, pinned Capacitor dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PROBE_DIR" --no-audit --no-fund --package-lock=false
          node -e "const p=require('./mobile/android-probe/node_modules/@capacitor/cli/package.json'); if (p.version !== '8.6.0') process.exit(2)"
          node -e "const p=require('./mobile/android-probe/node_modules/@capacitor/android/package.json'); if (p.version !== '8.6.0') process.exit(2)"

      - name: Generate local-only Android project
        shell: bash
        working-directory: mobile/android-probe
        run: |
          set -euo pipefail
          npx --no-install cap add android
          npx --no-install cap sync android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          node --check prepare-native-back.mjs
          node prepare-native-back.mjs
          NATIVE_DIR=android/app/src/main/java/it/trama/registrodocente/prova
          test -f "$NATIVE_DIR/MainActivity.java"
          cp native/MainActivity.java native/RegistroBackupFilesPlugin.java "$NATIVE_DIR/"
          grep -F 'registerPlugin(RegistroBackupFilesPlugin.class)' "$NATIVE_DIR/MainActivity.java"
          cp native/RegistroPdfFilesPlugin.java "$NATIVE_DIR/"
          grep -F 'registerPlugin(RegistroPdfFilesPlugin.class)' "$NATIVE_DIR/MainActivity.java"

      - name: Build debug APK (laboratory use only)
        shell: bash
        working-directory: mobile/android-probe/android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon assembleDebug

      - name: Verify APK, debug signature and hashes
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROBE_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$PROBE_DIR/probe-manifest-tree.txt"
          grep -E 'android:enableOnBackInvokedCallback.*0xffffffff$' "$PROBE_DIR/probe-manifest-tree.txt"
          unzip -Z1 "$APK" | grep -Fx 'assets/public/vendor/html2pdf.bundle.min.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/public/vendor/html2pdf.bundle.min.js.LICENSE.txt'
          unzip -p "$APK" assets/public/assets/DejaVu-LICENSE.txt | cmp - dist/assets/DejaVu-LICENSE.txt
          for FONT in dist/assets/DejaVuSans*.ttf; do
            unzip -p "$APK" "assets/public/assets/$(basename "$FONT")" | cmp - "$FONT"
          done
          unzip -p "$APK" assets/public/index.html | grep -F '/vendor/html2pdf.bundle.min.js'
          unzip -p "$APK" assets/public/vendor/html2pdf.bundle.min.js | cmp - dist/vendor/html2pdf.bundle.min.js
          unzip -p "$APK" assets/public/vendor/html2pdf.bundle.min.js.LICENSE.txt | cmp - dist/vendor/html2pdf.bundle.min.js.LICENSE.txt
          unzip -p "$APK" 'assets/public/assets/*.css' | grep -F -- '--safe-area-inset-top' > /dev/null
          unzip -p "$APK" 'assets/public/assets/*.js' | grep -F -- 'class-card-manage' > /dev/null
          sha256sum "$APK" | sed "s|$APK|app-debug.apk|" > "$PROBE_DIR/app-debug.sha256"
          {
            printf 'MOBILE-01/S0 ANDROID DEBUG PROBE — NOT FOR REAL DATA\n'
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'app_id=it.trama.registrodocente.prova\n'
            printf 'capacitor_version=8.6.0\n'
            printf 'apk_sha256='
            sha256sum "$APK" | awk '{print $1}'
            printf 'release_signing=false\n'
            printf 'offline_end_to_end_qualified=false\n'
            printf 'pdf_offline_bundle_present=true\n'
            printf 'remote_fonts_required=false\n'
            printf 'android_pdf_native_implemented=true\n'
            printf 'android_pdf_file_save_qualified=false\n'
            printf 'android_backup_native_implemented=true\n'
            printf 'android_restore_native_implemented=true\n'
            printf 'android_backup_device_qualified=false\n'
            printf 'android_restore_device_qualified=false\n'
            printf 'android_system_back_device_qualified=false\n'
            printf 'android_hpr_qualified=false\n'
            printf 'vault_android_qualified=false\n'
          } > "$PROBE_DIR/probe-manifest.txt"
          {
            printf 'M1 PDF library and license are included byte-for-byte in the APK.\n'
            printf 'No mandatory Google Fonts or CDN PDF script in index.html.\n'
            printf 'Native encrypted backup writer and reader included; device round trip NOT qualified.\n'
            printf 'Android native PDF writer included; PDF device save/open and sharing NOT qualified.\n'
            printf 'Node/Express API and real remote Copilota NOT bundled; offline fallback only.\n'
            printf 'Vault, lifecycle, Android device use and upgrades NOT qualified.\n'
          } > "$PROBE_DIR/offline-gaps.txt"

      - name: Upload private debug artifact — not a release
        uses: actions/upload-artifact@v4
        with:
          name: mobile01-android-debug-probe-${{ env.SOURCE_SHA }}
          path: |
            mobile/android-probe/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android-probe/app-debug.sha256
            mobile/android-probe/probe-manifest.txt
            mobile/android-probe/offline-gaps.txt
          if-no-files-found: error
          retention-days: 7

      - name: Prepare separate unsigned Beta identity
        shell: bash
        run: |
          set -euo pipefail
          node "$PROBE_DIR/prepare-beta.mjs"
          bash -n "$PROBE_DIR/sign-beta-locally.sh"

      - name: Build non-debuggable unsigned Beta candidate
        shell: bash
        working-directory: mobile/android-probe/android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon assembleRelease

      - name: Verify unsigned Beta package and provenance
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="$PROBE_DIR/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Unexpected signature on unsigned candidate"
            exit 1
          fi
          version_code="$(node -p "require('./mobile/android-probe/beta-identity.json').versionCode")"
          version_name="$(node -p "require('./mobile/android-probe/beta-identity.json').versionName")"
          "$tools/aapt" dump badging "$apk" > "$PROBE_DIR/beta-badging.txt"
          grep -F "package: name='it.trama.registrodocente' versionCode='$version_code' versionName='$version_name'" "$PROBE_DIR/beta-badging.txt"
          grep -Fx "application-label:'Registro Docente'" "$PROBE_DIR/beta-badging.txt"
          if grep -q '^application-debuggable' "$PROBE_DIR/beta-badging.txt"; then
            echo "Beta candidate is debuggable"
            exit 1
          fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$PROBE_DIR/beta-manifest-tree.txt"
          grep -E 'android:enableOnBackInvokedCallback.*0xffffffff$' "$PROBE_DIR/beta-manifest-tree.txt"
          grep -E 'android:allowBackup.*0x0$' "$PROBE_DIR/beta-manifest-tree.txt"
          grep -F 'android:dataExtractionRules' "$PROBE_DIR/beta-manifest-tree.txt"
          grep -F 'it.trama.registrodocente.prova.MainActivity' "$PROBE_DIR/beta-manifest-tree.txt"
          grep -F 'it.trama.registrodocente.fileprovider' "$PROBE_DIR/beta-manifest-tree.txt"
          unzip -p "$apk" assets/capacitor.config.json | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); if(c.appId!=='it.trama.registrodocente'||c.server?.url||c.loggingBehavior!=='none')process.exit(1)"
          unzip -p "$apk" assets/public/vendor/html2pdf.bundle.min.js | cmp - dist/vendor/html2pdf.bundle.min.js
          unzip -p "$apk" assets/public/assets/DejaVu-LICENSE.txt | cmp - dist/assets/DejaVu-LICENSE.txt
          for font in dist/assets/DejaVuSans*.ttf; do
            unzip -p "$apk" "assets/public/assets/$(basename "$font")" | cmp - "$font"
          done
          sha256sum "$apk" | sed "s|$apk|app-release-unsigned.apk|" > "$PROBE_DIR/beta-unsigned.sha256"
          {
            printf 'MOBILE-01/M4 UNSIGNED BETA CANDIDATE — NOT INSTALLABLE OR RELEASED\n'
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'app_id=it.trama.registrodocente\n'
            printf 'version_code=%s\n' "$version_code"
            printf 'version_name=%s\n' "$version_name"
            printf 'apk_sha256='
            sha256sum "$apk" | awk '{print $1}'
            printf 'release_signing=false\n'
            printf 'stable_owner_certificate_qualified=false\n'
            printf 'upgrade_device_qualified=false\n'
            printf 'migration_device_qualified=false\n'
            printf 'android_pdf_file_save_qualified=false\n'
            printf 'real_data_authorized=false\n'
          } > "$PROBE_DIR/beta-unsigned-manifest.txt"

      - name: Upload unsigned Beta candidate only — no private key or release
        uses: actions/upload-artifact@v4
        with:
          name: mobile01-android-beta-unsigned-${{ env.SOURCE_SHA }}
          path: |
            mobile/android-probe/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android-probe/beta-unsigned.sha256
            mobile/android-probe/beta-unsigned-manifest.txt
            mobile/android-probe/beta-identity.json
            mobile/android-probe/sign-beta-locally.sh
          if-no-files-found: error
          retention-days: 7
