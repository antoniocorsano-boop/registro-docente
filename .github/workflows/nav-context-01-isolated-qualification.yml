# Isolated, no-secrets qualification for NAV-CONTEXT-01 stacked PR #130.
# Never deploys or changes the canonical main workflow.
name: NAV-CONTEXT-01 Isolated Qualification

on:
  push:
    branches:
      - feat/nav-context-01-restore-student-origin

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  contracts:
    name: Typecheck / security / invariant contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate qualification registry
        run: bun scripts/qualification/check-invariants.mjs
      - name: Run NAV-CONTEXT and inherited contract tests
        run: |
          bun test \
            src/security/navContext01ReturnState.test.ts \
            src/security/navBack01StudentReportHistory.test.ts \
            src/security/mobileDensity01TabelloneContract.test.ts \
            src/security/mobileUxIntegrity.test.ts \
            src/security/homeNavigationDuringSaveIntegrity.test.ts
      - name: Typecheck
        run: bun run lint
      - name: Complete security and memory test suite
        run: bun run test:security
      - name: Build
        run: bun run build

  chromium:
    name: Synthetic Chromium Android 390 / 320
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nav-context-browser-tools browser-evidence
          echo '{"name":"nav-context-01-browser-tools","private":true}' > .nav-context-browser-tools/package.json
          npm --prefix .nav-context-browser-tools install --save-exact --package-lock=false '@playwright/test@1.64.1'
          ./.nav-context-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          cp tests/browser/nav-context-01-return-origin.spec.cjs .nav-context-browser-tools/
          cp tests/browser/nav-back-01-student-report.spec.cjs .nav-context-browser-tools/
      - name: Start synthetic Vite app fixture
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4173 --strictPort > browser-evidence/vite.log 2>&1 &
          echo $! > browser-evidence/vite.pid
          for attempt in $(seq 1 35); do
            if curl --fail --silent 'http://127.0.0.1:4173/tests/browser/fixtures/nav-back-01-app.html' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat browser-evidence/vite.log
          exit 1
      - name: Run real Chromium navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          cd .nav-context-browser-tools
          NAV_CONTEXT_BASE_URL='http://127.0.0.1:4173' \
          NAV_BACK_BASE_URL='http://127.0.0.1:4173' \
            ./node_modules/.bin/playwright test \
            nav-context-01-return-origin.spec.cjs \
            nav-back-01-student-report.spec.cjs \
            --workers=1 --reporter=line \
            --output=../browser-evidence/results
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-context-01-synthetic-chromium-${{ env.CANDIDATE_SHA }}
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14
