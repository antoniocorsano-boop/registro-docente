name: PREDEPLOY Security Qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run lint

      - name: Security tests
        id: security
        continue-on-error: true
        run: bun run test:security

      - name: Build
        run: bun run build

      - name: Production server startup smoke
        shell: bash
        run: |
          set +e
          NODE_ENV=production PORT=0 timeout 5s node server.ts
          code=$?
          if [[ "$code" -eq 124 ]]; then
            exit 0
          fi
          exit "$code"

      - name: Preserve qualification gates
        if: steps.typecheck.outcome == 'failure' || steps.security.outcome == 'failure'
        run: |
          echo "At least one PREDEPLOY qualification gate failed."
          exit 1

  p2-density-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualified product head
        uses: actions/checkout@v4
        with:
          ref: 121758cb7db961052a36ce36029b1633eb4388fe

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install product dependencies
        run: bun install --frozen-lockfile

      - name: Build exact product head
        run: bun run build

      - name: Install isolated Chromium runner
        run: |
          mkdir -p /tmp/p2pw
          cd /tmp/p2pw
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps

      - name: Start exact product server
        run: |
          NODE_ENV=production PORT=4173 node server.ts >/tmp/p2-density-server.log 2>&1 &
          echo $! >/tmp/p2-density-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/p2-density-server.log
          exit 1

      - name: Verify progressive disclosure in Chromium
        run: |
          mkdir -p browser-evidence
          cat >/tmp/p2pw/verify.cjs <<'NODE'
          const { chromium } = require('/tmp/p2pw/node_modules/playwright');
          const fs = require('fs');

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const pageWidthOk = page => page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1);
          const pageHeight = page => page.evaluate(() => document.documentElement.scrollHeight);
          const disclosure = (page, label) => page.locator('summary', { hasText: label }).first();
          const detailsFor = summary => summary.locator('xpath=..');
          const ensureClosed = async (summary, label) => {
            const details = detailsFor(summary);
            assert(await details.evaluate(el => el.open === false), `${label}: expected closed disclosure`);
          };
          const safeClickSummary = async (page, summary) => {
            await summary.evaluate(el => el.scrollIntoView({ block: 'center', inline: 'nearest' }));
            await sleep(80);
            const point = await summary.evaluate(el => {
              const r = el.getBoundingClientRect();
              const xs = [r.left + 24, r.left + r.width / 2, r.right - 24];
              const ys = [r.top + 18, r.top + r.height / 2, r.bottom - 18];
              for (const y of ys) {
                for (const x of xs) {
                  if (x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) continue;
                  const hit = document.elementFromPoint(x, y);
                  if (hit && (hit === el || el.contains(hit))) return { x, y };
                }
              }
              return null;
            });
            assert(point, 'Disclosure summary has no physically exposed hit-test point');
            await page.mouse.click(point.x, point.y);
          };
          const clickVisibleButton = async (page, name) => {
            const buttons = page.getByRole('button', { name, exact: true });
            const count = await buttons.count();
            for (let i = 0; i < count; i++) {
              if (await buttons.nth(i).isVisible()) {
                await buttons.nth(i).click();
                return;
              }
            }
            throw new Error(`No visible button: ${name}`);
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.getByLabel('Password locale').fill('density-browser-test');
            await page.getByRole('button', { name: 'Configura archivio protetto', exact: true }).click();
            await page.getByText('Le mie classi', { exact: true }).waitFor();
            await page.getByRole('button', { name: 'Apri classe', exact: true }).first().click();
            await sleep(200);

            await clickVisibleButton(page, 'Analisi');
            await page.getByText('Analisi medie & fasce analitiche', { exact: true }).waitFor();
            const analyticsSummary = disclosure(page, 'Approfondimenti analitici');
            await ensureClosed(analyticsSummary, 'Approfondimenti analitici / 390');
            assert(!(await page.getByText('Fasce analitiche della media', { exact: true }).isVisible()), '390: analytical bands should be hidden initially');
            const analytics390Closed = await pageHeight(page);
            assert(await pageWidthOk(page), '390 analytics: horizontal page overflow while closed');
            await page.screenshot({ path: 'browser-evidence/analytics-390-closed.png', fullPage: true });
            await analyticsSummary.click();
            await page.getByText('Fasce analitiche della media', { exact: true }).waitFor({ state: 'visible' });
            await sleep(150);
            const analytics390Open = await pageHeight(page);
            assert(analytics390Open > analytics390Closed + 300, `390 analytics: disclosure did not materially expand page (${analytics390Closed} -> ${analytics390Open})`);
            assert(await pageWidthOk(page), '390 analytics: horizontal page overflow while open');
            await page.screenshot({ path: 'browser-evidence/analytics-390-open.png', fullPage: true });
            await analyticsSummary.click();

            await page.setViewportSize({ width: 1280, height: 900 });
            await sleep(120);
            await ensureClosed(analyticsSummary, 'Approfondimenti analitici / 1280');
            const analytics1280Closed = await pageHeight(page);
            assert(await pageWidthOk(page), '1280 analytics: horizontal page overflow while closed');
            await page.screenshot({ path: 'browser-evidence/analytics-1280-closed.png', fullPage: true });
            await analyticsSummary.click();
            await page.getByText('Fasce analitiche della media', { exact: true }).waitFor({ state: 'visible' });
            await sleep(150);
            const analytics1280Open = await pageHeight(page);
            assert(analytics1280Open > analytics1280Closed + 300, `1280 analytics: disclosure did not materially expand page (${analytics1280Closed} -> ${analytics1280Open})`);
            assert(await pageWidthOk(page), '1280 analytics: horizontal page overflow while open');
            await page.screenshot({ path: 'browser-evidence/analytics-1280-open.png', fullPage: true });
            await analyticsSummary.click();

            await clickVisibleButton(page, 'Menu');
            await clickVisibleButton(page, 'Scheda alunno');
            await page.getByText('Scheda Alunno & Profilo delle Competenze', { exact: true }).waitFor();

            const reportCases = [
              ['Profilo interno di evidenze', 'Grafico a Raggio (Radar) · Profilo interno di evidenze'],
              ['Dossier UDA', 'Dossier Valutativo per Unità Didattica (UDA)'],
              ['Elenco valutazioni', 'Elenco Valutazioni Ricevute'],
              ['Comportamenti e partecipazione', 'Registro Comportamenti & Partecipazione'],
            ];

            const report1280Closed = await pageHeight(page);
            for (const [label, deepText] of reportCases) {
              const summary = disclosure(page, label);
              await ensureClosed(summary, `${label} / 1280`);
              assert(!(await page.getByText(deepText, { exact: true }).isVisible()), `${label} / 1280: deep content visible before open`);
              await safeClickSummary(page, summary);
              await page.getByText(deepText, { exact: true }).waitFor({ state: 'visible' });
              assert(await detailsFor(summary).evaluate(el => el.open === true), `${label} / 1280: did not open`);
              await safeClickSummary(page, summary);
              await ensureClosed(summary, `${label} / 1280 reclose`);
            }
            assert(await pageWidthOk(page), '1280 student report: horizontal page overflow');
            await page.screenshot({ path: 'browser-evidence/report-1280-closed.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await sleep(120);
            const report390Closed = await pageHeight(page);
            for (const [label, deepText] of reportCases) {
              const summary = disclosure(page, label);
              await ensureClosed(summary, `${label} / 390`);
              assert(!(await page.getByText(deepText, { exact: true }).isVisible()), `${label} / 390: deep content visible before open`);
              await safeClickSummary(page, summary);
              await page.getByText(deepText, { exact: true }).waitFor({ state: 'visible' });
              assert(await detailsFor(summary).evaluate(el => el.open === true), `${label} / 390: did not open`);
              await safeClickSummary(page, summary);
            }
            assert(await pageWidthOk(page), '390 student report: horizontal page overflow');
            await page.screenshot({ path: 'browser-evidence/report-390-closed.png', fullPage: true });

            const result = {
              exactProductHead: '121758cb7db961052a36ce36029b1633eb4388fe',
              analytics: {
                mobileClosedHeight: analytics390Closed,
                mobileOpenHeight: analytics390Open,
                desktopClosedHeight: analytics1280Closed,
                desktopOpenHeight: analytics1280Open,
              },
              studentReport: {
                desktopClosedHeight: report1280Closed,
                mobileClosedHeight: report390Closed,
                disclosuresVerified: reportCases.map(([label]) => label),
              },
              consoleErrors: errors,
            };
            fs.writeFileSync('browser-evidence/result.json', JSON.stringify(result, null, 2));
            assert(errors.length === 0, `Browser/page console errors: ${errors.join(' | ')}`);
            console.log(JSON.stringify(result));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/p2pw/verify.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-density-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
