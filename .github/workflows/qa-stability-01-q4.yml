# QA-STABILITY-01/Q4 — isolated laboratory; not a main qualification or release.
name: QA-STABILITY-01 Q4 — six independent Android laboratory trials
on:
  pull_request:
    branches: [fix/audit-pre-01-atomic-bootstrap]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      ${{ github.repository == 'antoniocorsano-boop/registro-docente' &&
      github.event.pull_request.number == 414 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/qa-stability-01-q2' &&
      github.event.pull_request.base.sha == '80378e9daab60fe6c389e372c3c79e3dcd09aac0' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Q4 candidate without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify complete native laboratory contracts before six trials
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/diagnostics/run-native-lab-contracts.mjs
  q4:
    needs: preflight
    if: >-
      ${{ github.repository == 'antoniocorsano-boop/registro-docente' &&
      github.event.pull_request.number == 414 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/qa-stability-01-q2' &&
      github.event.pull_request.base.sha == '80378e9daab60fe6c389e372c3c79e3dcd09aac0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trial: [1, 2, 3]
    uses: ./.github/workflows/ap02-f2-native-device.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      trial: ${{ matrix.trial }}
