name: QUAL-NATIVE-01 — exact APK diagnostic (not release)
on:
  pull_request:
    branches: ['test/b4-3-android-lab']
permissions:
  contents: read
  actions: read
jobs:
  native-back:
    if: github.head_ref == 'diagnostic/qual-native-01'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [32, 36]
    env:
      LAB_API: ${{ matrix.api }}
      LAB_PACKAGE: it.trama.registrodocente.lab.b43
      LAB_SOURCE_SHA: 94a0115108dc4405a8bfb6c3156037fddfde5d57
      LAB_ARTIFACT_ID: '14151117793'
      LAB_EXPECTED_DIGEST: '8bbbefa0cd94a761029894ab2032ef48972d95a221dfe100833fbd61019452f2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Obtain exact previously built artifact (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence lab-apk
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LAB_ARTIFACT_ID" > native-evidence/artifact.json
          jq -e --arg sha "$LAB_SOURCE_SHA" '.expired == false and .workflow_run.head_sha == $sha' native-evidence/artifact.json
          curl --fail --silent --show-error --location --retry 1 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LAB_ARTIFACT_ID/zip" -o lab-apk/package.zip
          unzip -q lab-apk/package.zip -d lab-apk
          APK="$(find lab-apk -name app-debug.apk -type f)"
          MANIFEST="$(find lab-apk -name probe-manifest.txt -type f)"
          HASH="$(find lab-apk -name app-debug.sha256 -type f)"
          test -f "$APK" && test -f "$MANIFEST" && test -f "$HASH"
          grep -Fx "source_sha=$LAB_SOURCE_SHA" "$MANIFEST"
          grep -Fx "app_id=$LAB_PACKAGE" "$MANIFEST"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$HASH")"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$LAB_EXPECTED_DIGEST"
          grep -Fx "apk_sha256=$LAB_EXPECTED_DIGEST" "$MANIFEST"
          cp "$MANIFEST" native-evidence/probe-manifest.txt
          printf 'APK=%s\n' "$APK" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 (same toolchain as packaging)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable hardware acceleration on isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot Android API ${{ matrix.api }} and exercise exact APK
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trama-qual-native-api${{ matrix.api }}
          emulator-boot-timeout: 240
          disable-animations: false
          disable-linux-hw-accel: false
          script: bash scripts/diagnostics/run-qual-native-01.sh
      - name: Require complete diagnostic observations (not product PASS)
        run: |
          jq -e --arg sha "$LAB_SOURCE_SHA" --argjson api "$LAB_API" '.sourceSha == $sha and .api == $api and .releaseQualified == false and .diagnosticOnly == true and any(.results[]; .stage == "diagnostic-complete" and .planned == 8 and .observed == 8)' native-evidence/qual-native-result.json
      - name: Upload non-release diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qual-native-01-api${{ matrix.api }}-${{ github.event.pull_request.head.sha }}
          path: native-evidence/
          retention-days: 7
