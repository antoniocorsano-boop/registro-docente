name: SEC-0 SEC-1 Qualification

on:
  push:
    branches:
      - feat/sec-0-sec-1-secure-vault

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Security tests when present
        shell: bash
        run: |
          shopt -s nullglob
          tests=(src/security/*.test.ts)
          if (( ${#tests[@]} )); then
            bun test "${tests[@]}"
          else
            echo "No security tests yet; baseline verification only."
          fi

      - name: Build
        run: bun run build
