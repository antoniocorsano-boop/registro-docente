name: SEC-0 SEC-1 Qualification

on:
  push:
    branches:
      - feat/sec-0-sec-1-secure-vault

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bun run lint > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          diagnostic=$(grep -m 1 -E 'error TS[0-9]+:' typecheck.log || tail -n 1 typecheck.log)
          diagnostic=${diagnostic//$'\n'/ }
          diagnostic=${diagnostic:0:120}
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish typecheck diagnostic
        if: steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ steps.typecheck.outputs.diagnostic }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='SEC-0/1 baseline typecheck' \
            -f description="${DIAGNOSTIC:-Typecheck failed; inspect workflow log.}"

      - name: Security tests when present
        shell: bash
        run: |
          shopt -s nullglob
          tests=(src/security/*.test.ts)
          if (( ${#tests[@]} )); then
            bun test "${tests[@]}"
          else
            echo "No security tests yet; baseline verification only."
          fi

      - name: Build
        run: bun run build

      - name: Preserve typecheck gate
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "Baseline typecheck is failing; SEC tests/build were still executed for classification."
          exit 1
