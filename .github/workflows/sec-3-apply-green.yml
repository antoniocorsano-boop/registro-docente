name: SEC-3 Apply Exact Green Patch

on:
  push:
    branches:
      - feat/sec-3-outbound-boundary-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply bounded SEC-3 replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/UdaGanttView.tsx',
              """          competencies: targetUda.competencies,\n          authenticTask: targetUda.authenticTask\n""",
              """          competencies: targetUda.competencies,\n          authenticTask: targetUda.authenticTask,\n          classification: 'TEACHER_PROFESSIONAL',\n          explicitTeacherOptIn: true\n"""
          )

          replace_once(
              'server.ts',
              """function isRemoteEmbeddingAllowed(\n  classification: unknown,\n  explicitTeacherOptIn: unknown\n): boolean {\n  if (typeof classification !== 'string') return false;\n  return (\n    evaluateDataFlow(\n      classification as DataClassification,\n      'REMOTE_PROVIDER',\n      explicitTeacherOptIn === true\n    ) === 'ALLOW'\n  );\n}\n""",
              """function isRemoteEmbeddingAllowed(\n  classification: unknown,\n  explicitTeacherOptIn: unknown\n): boolean {\n  if (typeof classification !== 'string') return false;\n  return (\n    evaluateDataFlow(\n      classification as DataClassification,\n      'REMOTE_PROVIDER',\n      explicitTeacherOptIn === true\n    ) === 'ALLOW'\n  );\n}\n\nfunction isLoopbackEndpointUrl(value: unknown): boolean {\n  if (typeof value !== 'string' || !value.trim()) return false;\n  try {\n    const url = new URL(value);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') return false;\n    const hostname = url.hostname.toLowerCase();\n    return (\n      hostname === 'localhost' ||\n      hostname === '127.0.0.1' ||\n      hostname === '[::1]' ||\n      hostname === '::1'\n    );\n  } catch {\n    return false;\n  }\n}\n"""
          )

          replace_once(
              'server.ts',
              """      civicEducation,\n      competencies,\n      authenticTask\n    } = req.body;\n""",
              """      civicEducation,\n      competencies,\n      authenticTask,\n      classification,\n      explicitTeacherOptIn\n    } = req.body;\n"""
          )

          replace_once(
              'server.ts',
              """    if (!title || typeof title !== 'string' || !title.trim()) {\n      return res.status(400).json({ error: 'Il titolo dell\\'UDA è obbligatorio.' });\n    }\n\n    const apiKey = process.env.GEMINI_API_KEY;\n""",
              """    if (!title || typeof title !== 'string' || !title.trim()) {\n      return res.status(400).json({ error: 'Il titolo dell\\'UDA è obbligatorio.' });\n    }\n\n    if (\n      classification !== 'TEACHER_PROFESSIONAL' ||\n      !isRemoteEmbeddingAllowed(classification, explicitTeacherOptIn)\n    ) {\n      return res.status(403).json({\n        error: 'Flusso dati UDA verso provider remoto non consentito dalla policy SEC-3.'\n      });\n    }\n\n    const apiKey = process.env.GEMINI_API_KEY;\n"""
          )

          server_guard_old = """    if (!config) {\n      return res.status(400).json({ error: 'Configurazione mancante.' });\n    }\n\n    if (config.provider === 'gemini') {\n"""
          server_guard_new = """    if (!config) {\n      return res.status(400).json({ error: 'Configurazione mancante.' });\n    }\n\n    if (\n      config.provider === 'local' &&\n      !isLoopbackEndpointUrl(config.endpointUrl || 'http://127.0.0.1:8080')\n    ) {\n      return res.status(403).json({\n        success: false,\n        error: 'Endpoint embedding locale non consentito: usare esclusivamente loopback.'\n      });\n    }\n\n    if (config.provider === 'gemini') {\n"""
          p = Path('server.ts')
          text = p.read_text()
          count = text.count(server_guard_old)
          if count != 2:
              raise SystemExit(f'server.ts: expected two embedding config guards, found {count}')
          text = text.replace(server_guard_old, server_guard_new, 2)
          p.write_text(text)

          replace_once(
              'src/services/embeddingService.ts',
              """function normalizeUrl(url: string): string {\n  return url.trim().replace(/\\/+$/, '');\n}\n""",
              """function normalizeUrl(url: string): string {\n  return url.trim().replace(/\\/+$/, '');\n}\n\nfunction isLoopbackEndpointUrl(value: string): boolean {\n  if (!value.trim()) return false;\n  try {\n    const url = new URL(value);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') return false;\n    const hostname = url.hostname.toLowerCase();\n    return (\n      hostname === 'localhost' ||\n      hostname === '127.0.0.1' ||\n      hostname === '[::1]' ||\n      hostname === '::1'\n    );\n  } catch {\n    return false;\n  }\n}\n\nfunction assertLoopbackLocalEndpoint(config: LocalEmbeddingConfig): void {\n  if (config.provider === 'local' && !isLoopbackEndpointUrl(config.endpointUrl)) {\n    throw new Error('Endpoint embedding locale non consentito: usare esclusivamente loopback.');\n  }\n}\n"""
          )

          replace_once(
              'src/services/embeddingService.ts',
              """  assertEmbeddingFlowAllowed(config, context);\n\n  const cacheKey = `${config.provider}:${config.endpointUrl}:${config.modelName}:${cleanText}`;\n""",
              """  assertEmbeddingFlowAllowed(config, context);\n  assertLoopbackLocalEndpoint(config);\n\n  const cacheKey = `${config.provider}:${config.endpointUrl}:${config.modelName}:${cleanText}`;\n"""
          )

          replace_once(
              'src/services/embeddingService.ts',
              """export async function testEmbeddingConnection(\n  config: LocalEmbeddingConfig\n): Promise<EmbeddingTestResult> {\n  const start = performance.now();\n\n  if (config.provider === 'gemini') {\n""",
              """export async function testEmbeddingConnection(\n  config: LocalEmbeddingConfig\n): Promise<EmbeddingTestResult> {\n  const start = performance.now();\n\n  if (config.provider === 'local') {\n    try {\n      assertLoopbackLocalEndpoint(config);\n    } catch (err: any) {\n      return {\n        success: false,\n        latencyMs: Math.round(performance.now() - start),\n        error: err.message || 'Endpoint embedding locale non consentito.'\n      };\n    }\n  }\n\n  if (config.provider === 'gemini') {\n"""
          )
          PY

      - name: Commit bounded implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/components/UdaGanttView.tsx src/services/embeddingService.ts
          git diff --cached --check
          git commit -m 'fix(sec-3): close outbound provider boundaries'
          git push origin HEAD:feat/sec-3-outbound-boundary-closure
