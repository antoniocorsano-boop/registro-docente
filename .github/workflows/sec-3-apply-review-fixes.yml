name: SEC-3 Apply Review Fixes

on:
  push:
    branches:
      - feat/sec-3-outbound-boundary-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded SEC-3 review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          replace_exact(
              'src/services/embeddingService.ts',
              """function assertLoopbackLocalEndpoint(config: LocalEmbeddingConfig): void {
            if (config.provider === 'local' && !isLoopbackEndpointUrl(config.endpointUrl)) {
              throw new Error('Endpoint embedding locale non consentito: usare esclusivamente loopback.');
            }
          }
          """,
              """function assertLoopbackLocalEndpoint(config: LocalEmbeddingConfig): void {
            if (config.provider === 'local' && !isLoopbackEndpointUrl(config.endpointUrl)) {
              throw new Error('Endpoint embedding locale non consentito: usare esclusivamente loopback.');
            }
          }

          function assertSupportedEmbeddingProvider(config: LocalEmbeddingConfig): void {
            const provider: unknown = config.provider;
            if (provider !== 'local' && provider !== 'gemini') {
              throw new Error('Provider embedding non consentito.');
            }
          }
          """
          )

          replace_exact(
              'src/services/embeddingService.ts',
              """  assertEmbeddingFlowAllowed(config, context);
            assertLoopbackLocalEndpoint(config);
          """,
              """  assertSupportedEmbeddingProvider(config);
            assertEmbeddingFlowAllowed(config, context);
            assertLoopbackLocalEndpoint(config);
          """
          )

          replace_exact(
              'src/services/embeddingService.ts',
              """  const start = performance.now();

            if (config.provider === 'local') {
          """,
              """  const start = performance.now();

            try {
              assertSupportedEmbeddingProvider(config);
            } catch (err: any) {
              return {
                success: false,
                latencyMs: Math.round(performance.now() - start),
                error: err.message || 'Provider embedding non consentito.'
              };
            }

            if (config.provider === 'local') {
          """
          )

          replace_exact(
              'src/services/embeddingService.ts',
              """      method: 'POST',
                headers,
          """,
              """      method: 'POST',
                redirect: 'error',
                headers,
          """,
              expected=3
          )

          replace_exact(
              'server.ts',
              """      method: 'POST',
                headers: { 'Content-Type': 'application/json', ...headers },
          """,
              """      method: 'POST',
                redirect: 'error',
                headers: { 'Content-Type': 'application/json', ...headers },
          """,
              expected=2
          )
          PY

          git diff --check
          git diff -- src/services/embeddingService.ts server.ts

      - name: Commit bounded fixes and remove transient workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/embeddingService.ts server.ts
          git rm .github/workflows/sec-3-apply-review-fixes.yml
          git diff --cached --check
          git commit -m 'fix(sec-3): close client and redirect bypasses'
          git push origin HEAD:feat/sec-3-outbound-boundary-closure
