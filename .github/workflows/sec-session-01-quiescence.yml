name: SEC-SESSION-01 S2a mutation boundary
on:
  pull_request:
    branches: ['test/b4-3-android-lab']
permissions:
  contents: read
jobs:
  contracts:
    if: github.head_ref == 'feat/sec-session-01-quiescence'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src/security/durableMutationCoordinator.test.ts src/security/persist01hCoordinatorContract.test.ts
      - run: bun run lint
