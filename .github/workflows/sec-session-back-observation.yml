name: SEC-SESSION-01 — native Back lifecycle observation
on:
  pull_request:
    branches: ['ci/beta2-session-reference']
permissions:
  contents: read
  actions: read
jobs:
  session-observation:
    if: github.head_ref == 'diagnostic/sec-session-native-back'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [32]
    env:
      LAB_API: ${{ matrix.api }}
      LAB_PACKAGE: it.trama.registrodocente.lab.b43
      LAB_SOURCE_SHA: 29cdc46a6971dc932482cf26a82b080a674c9d47
      LAB_ARTIFACT_ID: '14158806334'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Obtain exact previously built artifact (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence lab-apk
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LAB_ARTIFACT_ID" > native-evidence/artifact.json
          jq -e --arg sha "$LAB_SOURCE_SHA" '.expired == false and .workflow_run.head_sha == $sha' native-evidence/artifact.json
          curl --fail --silent --show-error --location --retry 1 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LAB_ARTIFACT_ID/zip" -o lab-apk/package.zip
          unzip -q lab-apk/package.zip -d lab-apk
          APK="$(find lab-apk -name app-debug.apk -type f)"
          MANIFEST="$(find lab-apk -name probe-manifest.txt -type f)"
          HASH="$(find lab-apk -name app-debug.sha256 -type f)"
          test -f "$APK" && test -f "$MANIFEST" && test -f "$HASH"
          grep -Fx "source_sha=$LAB_SOURCE_SHA" "$MANIFEST"
          grep -Fx "app_id=$LAB_PACKAGE" "$MANIFEST"
          grep -Fx "application_candidate_sha=$LAB_SOURCE_SHA" "$MANIFEST"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$HASH")"
          digest="$(sha256sum "$APK" | cut -d' ' -f1)"
          grep -Fx "apk_sha256=$digest" "$MANIFEST"
          grep -Fx "release_signing=false" "$MANIFEST"
          cp "$MANIFEST" native-evidence/probe-manifest.txt
          printf 'APK=%s\n' "$APK" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 (same toolchain as packaging)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable hardware acceleration on isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot Android API ${{ matrix.api }} and exercise exact APK
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: trama-qual-native-api${{ matrix.api }}
          emulator-boot-timeout: 240
          disable-animations: false
          disable-linux-hw-accel: false
          script: bash scripts/diagnostics/run-sec-session-back-observation.sh
      - name: Require diagnostic completeness only (not product PASS)
        run: |
          set -euo pipefail
          for trial in native dom-setup; do
            jq -e --arg sha "$LAB_SOURCE_SHA" --arg trial "$trial" '.sourceSha == $sha and .trial == $trial and .api == 32 and .diagnosticOnly == true and .releaseQualified == false and any(.results[]; .stage == "initial") and any(.results[]; .stage == "emulator-only-diagnostic" or .stage == "diagnostic-incomplete-or-failed")' "native-evidence/back-observation-$trial.json"
            test -s "native-evidence/logcat-$trial.txt"
          done
      - name: Upload non-release diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-session-01-api${{ matrix.api }}-${{ github.event.pull_request.head.sha }}
          path: native-evidence/
          retention-days: 7
