name: UXQA01 materializer fixer

on:
  push:
    branches:
      - feat/ux-qa-01-autonomous-navigation

permissions:
  contents: write

jobs:
  fix-materializer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-qa-01-autonomous-navigation
          fetch-depth: 0
      - name: Fix exact occurrence contract and self-remove
        shell: python
        run: |
          from pathlib import Path
          target = Path('.github/workflows/uxqa01-product-materializer.yml')
          text = target.read_text()
          old = """          for old, new in replacements:\n            count = text.count(old)\n            if count != 1:\n              raise SystemExit(f'App replacement expected once, got {count}: {old[:80]!r}')\n            text = text.replace(old, new)\n"""
          new = """          for old, new in replacements:\n            count = text.count(old)\n            expected_count = 2 if \"onNavigateTab={setActiveTab}\" in old else 1\n            if count != expected_count:\n              raise SystemExit(f'App replacement expected {expected_count}, got {count}: {old[:80]!r}')\n            text = text.replace(old, new)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one materializer loop, found {text.count(old)}')
          target.write_text(text.replace(old, new))
          Path('.github/workflows/uxqa01-materializer-fixer.yml').unlink()
      - name: Commit corrected materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/uxqa01-product-materializer.yml .github/workflows/uxqa01-materializer-fixer.yml
          git diff --cached --check
          git commit -m "chore: fix UX-QA product materializer occurrence contract"
          git push origin HEAD:feat/ux-qa-01-autonomous-navigation
