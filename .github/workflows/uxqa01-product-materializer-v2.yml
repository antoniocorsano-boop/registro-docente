name: UXQA01 product materializer v2

on:
  push:
    branches:
      - feat/ux-qa-01-autonomous-navigation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-qa-01-autonomous-navigation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact product GREEN
        run: python scripts/ux-qa/materialize-product-green.py
      - name: Verify product before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bun install --frozen-lockfile
          bun run lint
          bun run test:security
      - name: Commit product-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make navigation explicit and home teacher-first"
          git push origin HEAD:feat/ux-qa-01-autonomous-navigation
