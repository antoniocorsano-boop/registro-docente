name: UXQA01 product materializer

on:
  push:
    branches:
      - feat/ux-qa-01-autonomous-navigation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-qa-01-autonomous-navigation
          fetch-depth: 0

      - name: Materialize UX-QA product GREEN and self-remove
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          replacements = [
            (
              "        currentClassId: persisted.currentClassId || null\n",
              "        // Navigation context is session-only: a previously persisted class must not reactivate on entry.\n        currentClassId: null\n"
            ),
            (
              "  const libraryMutationPendingCountRef = useRef(0);\n  const mutationCoordinatorRef = useRef<ReturnType<typeof createDurableMutationCoordinator> | null>(null);\n",
              "  const libraryMutationPendingCountRef = useRef(0);\n\n  const handleNavigateTab = useCallback((tab: ActiveTab) => {\n    navigationVersionRef.current += 1;\n    setActiveTabState(tab);\n    const classId = currentClassIdRef.current;\n    try {\n      const state = { classId, tab };\n      const params = new URLSearchParams();\n      if (classId) params.set('class', classId);\n      if (tab !== 'home' && tab !== 'dashboard') params.set('tab', tab);\n      const query = params.toString();\n      history.pushState(state, '', query ? `?${query}` : window.location.pathname);\n    } catch (e) {}\n  }, []);\n\n  const mutationCoordinatorRef = useRef<ReturnType<typeof createDurableMutationCoordinator> | null>(null);\n"
            ),
            (
              "      appDataRef.current = restored.appData;\n      currentClassIdRef.current = restored.appData.currentClassId;\n",
              "      const restoredVisibleAppData = { ...restored.appData, currentClassId: null };\n      appDataRef.current = restoredVisibleAppData;\n      currentClassIdRef.current = null;\n"
            ),
            (
              "      setAppData(restored.appData);\n",
              "      setAppData(restoredVisibleAppData);\n"
            ),
            (
              "        setActiveTab={setActiveTab}\n",
              "        setActiveTab={handleNavigateTab}\n"
            ),
            (
              "            onNavigateTab={setActiveTab}\n",
              "            onNavigateTab={handleNavigateTab}\n"
            )
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'App replacement expected once, got {count}: {old[:80]!r}')
            text = text.replace(old, new)

          app.write_text(text)

          browser_test = Path('tests/browser/ux-trust-01-qualification.spec.cjs')
          test_text = browser_test.read_text()
          old = "  await expect(page.getByRole('heading', { name: 'Le mie classi' })).toBeVisible();\n  await expect(page.getByText(/Ultimo backup cifrato:/)).toBeVisible();\n"
          new = "  await expect(page.getByRole('heading', { name: 'Le mie classi' })).toBeVisible();\n  await page.getByRole('main').getByRole('button', { name: 'Sintesi', exact: true }).click();\n  await expect(page.getByText(/Ultimo backup cifrato:/)).toBeVisible();\n"
          if test_text.count(old) != 1:
            raise SystemExit(f'UXT-B progressive-disclosure replacement expected once, got {test_text.count(old)}')
          browser_test.write_text(test_text.replace(old, new))
          PY

          cat > src/components/HomeView.tsx <<'EOF'
          import React, { useState } from 'react';
          import { ClassData } from '../types';
          import { calcAvg, formatGrade } from '../utils';
          import { Sparkline } from './Sparkline';
          import {
            GraduationCap,
            Plus,
            Users,
            AlertTriangle,
            Download,
            Trash2,
            TrendingUp,
            FolderOpen
          } from 'lucide-react';

          interface HomeViewProps {
            classes: ClassData[];
            onSelectClass: (classId: string) => void;
            onAddClass: () => Promise<void>;
            onDeleteClass: (classId: string) => Promise<void>;
            onExportBackup: () => void;
            lastBackupDate: string | null;
            unsavedChangesCount: number;
          }

          type HomeViewMode = 'classes' | 'summary' | 'comparison';

          const CLASS_ACCENTS = [
            '#38bdf8',
            '#a78bfa',
            '#fbbf24',
            '#60a5fa',
            '#e879f9',
            '#fb923c',
            '#818cf8'
          ] as const;

          export const HomeView: React.FC<HomeViewProps> = ({
            classes,
            onSelectClass,
            onAddClass,
            onDeleteClass,
            onExportBackup,
            lastBackupDate,
            unsavedChangesCount
          }) => {
            const [activeView, setActiveView] = useState<HomeViewMode>('classes');
            const [isClassMutationPending, setIsClassMutationPending] = useState(false);

            const handleAddClass = async () => {
              if (isClassMutationPending) return;
              setIsClassMutationPending(true);
              try {
                await onAddClass();
              } catch {
                return;
              } finally {
                setIsClassMutationPending(false);
              }
            };

            const handleDeleteClass = async (classId: string) => {
              if (isClassMutationPending) return;
              setIsClassMutationPending(true);
              try {
                await onDeleteClass(classId);
              } catch {
                return;
              } finally {
                setIsClassMutationPending(false);
              }
            };

            const classMetrics = classes.map(c => {
              const grades = c.grades || [];
              const averages = c.students
                .map(student => calcAvg(grades.filter(grade => grade.studentId === student.id)))
                .filter((value): value is number => value !== null && !isNaN(value));
              const average = averages.length > 0
                ? averages.reduce((sum, value) => sum + value, 0) / averages.length
                : null;
              const sufficiency = averages.length > 0
                ? Math.round((averages.filter(value => value >= 6).length / averages.length) * 100)
                : null;

              return {
                classData: c,
                grades,
                averages,
                average,
                sufficiency,
                advancedCount: averages.length > 0 ? averages.filter(value => value >= 8.5).length : null,
                atRiskCount: averages.length > 0 ? averages.filter(value => value < 6).length : null
              };
            });

            const totalStudents = classes.reduce((sum, c) => sum + c.students.length, 0);
            const totalGrades = classes.reduce((sum, c) => sum + (c.grades || []).length, 0);
            const allStudentAverages = classMetrics.flatMap(item => item.averages);
            const instituteAvg = allStudentAverages.length > 0
              ? allStudentAverages.reduce((sum, value) => sum + value, 0) / allStudentAverages.length
              : null;
            const instituteSuffRate = allStudentAverages.length > 0
              ? Math.round((allStudentAverages.filter(value => value >= 6).length / allStudentAverages.length) * 100)
              : null;
            const isBackupStale = !lastBackupDate || unsavedChangesCount >= 10;

            const viewButtonClass = (view: HomeViewMode) =>
              `min-h-[44px] px-3 py-2 rounded-lg border text-xs font-semibold transition-all ${
                activeView === view
                  ? 'bg-[var(--primary)] text-slate-950 border-[var(--primary)] shadow-[0_0_10px_var(--primary)]'
                  : 'bg-[var(--surface-variant)] text-slate-300 border-[var(--border)] hover:text-white hover:border-[var(--primary)]'
              }`;

            return (
              <div className="space-y-4">
                <section className="neon-card neon-card-highlight p-4 sm:p-5">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h2 className="text-xl font-bold text-[var(--primary)] drop-shadow-[0_0_8px_var(--primary)]">
                        Le mie classi
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Scegli la classe su cui vuoi lavorare. Nessuna classe viene attivata automaticamente.
                      </p>
                    </div>

                    <button
                      onClick={handleAddClass}
                      disabled={isClassMutationPending}
                      className="min-h-[44px] self-start sm:self-auto px-4 py-2 rounded-lg neon-btn-primary text-xs font-semibold inline-flex items-center justify-center gap-1.5"
                    >
                      <Plus className="w-4 h-4" /> Nuova Classe
                    </button>
                  </div>

                  <div role="group" aria-label="Vista home" className="grid grid-cols-3 gap-2 mt-4">
                    <button
                      type="button"
                      aria-pressed={activeView === 'classes'}
                      onClick={() => setActiveView('classes')}
                      className={viewButtonClass('classes')}
                    >
                      Classi
                    </button>
                    <button
                      type="button"
                      aria-pressed={activeView === 'summary'}
                      onClick={() => setActiveView('summary')}
                      className={viewButtonClass('summary')}
                    >
                      Sintesi
                    </button>
                    <button
                      type="button"
                      aria-pressed={activeView === 'comparison'}
                      onClick={() => setActiveView('comparison')}
                      className={viewButtonClass('comparison')}
                    >
                      Confronto
                    </button>
                  </div>
                </section>

                {activeView === 'classes' && (
                  <section className="neon-card p-4" aria-label="Classi disponibili">
                    <div className="flex items-center justify-between gap-3 mb-3">
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <GraduationCap className="w-4 h-4 text-[var(--primary)]" /> Classi
                      </h3>
                      <span className="text-xs text-slate-400">{classes.length} sezioni</span>
                    </div>

                    {classes.length === 0 ? (
                      <div className="text-center py-8 border border-dashed border-slate-700 rounded-lg p-6">
                        <Users className="w-10 h-10 text-slate-600 mx-auto mb-2" />
                        <p className="text-sm text-slate-400 mb-3">Nessuna classe presente nel registro.</p>
                        <button
                          onClick={handleAddClass}
                          disabled={isClassMutationPending}
                          className="min-h-[44px] px-4 py-2 rounded-lg neon-btn-primary text-xs font-semibold inline-flex items-center gap-1.5"
                        >
                          <Plus className="w-4 h-4" /> Crea la Prima Classe
                        </button>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                        {classMetrics.map((item, index) => {
                          const { classData: c, average } = item;
                          const accentIndex = index % CLASS_ACCENTS.length;
                          const accent = CLASS_ACCENTS[accentIndex];

                          return (
                            <div
                              key={c.id}
                              data-uxqa-class-card
                              data-accent-index={accentIndex}
                              className="relative rounded-xl border bg-[var(--surface-variant)]/75 overflow-hidden min-w-0"
                              style={{ borderColor: accent }}
                            >
                              <button
                                type="button"
                                aria-label={`Apri classe ${c.name}`}
                                onClick={() => onSelectClass(c.id)}
                                className="w-full min-h-[112px] p-3 pr-10 text-left flex flex-col justify-between hover:bg-slate-800/50 transition-colors"
                              >
                                <span>
                                  <span className="block text-lg font-black leading-none" style={{ color: accent }}>
                                    {c.name}
                                  </span>
                                  <span className="block text-[11px] text-slate-400 mt-2">
                                    {c.students.length} {c.students.length === 1 ? 'alunno' : 'alunni'} · media {formatGrade(average)}
                                  </span>
                                </span>
                                <span className="inline-flex items-center gap-1 text-xs font-semibold text-slate-200 mt-3">
                                  <FolderOpen className="w-3.5 h-3.5" /> Apri classe
                                </span>
                              </button>

                              <button
                                type="button"
                                aria-label={`Elimina classe ${c.name}`}
                                title="Elimina classe"
                                disabled={isClassMutationPending}
                                onClick={() => {
                                  if (confirm(`Eliminare definitivamente la classe "${c.name}" con tutti i suoi dati?`)) {
                                    void handleDeleteClass(c.id);
                                  }
                                }}
                                className="absolute top-1.5 right-1.5 min-w-[44px] min-h-[44px] inline-flex items-center justify-center text-slate-500 hover:text-rose-400 rounded-lg hover:bg-slate-900/70 transition-colors"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </section>
                )}

                {activeView === 'summary' && (
                  <section className="neon-card p-4 sm:p-5" aria-label="Sintesi del registro">
                    <div className="flex items-center justify-between gap-3 mb-4">
                      <h3 className="text-base font-bold text-white">Sintesi numerica</h3>
                      <span className="text-xs text-slate-400">Tutte le classi</span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                      <div className="p-3.5 rounded-lg bg-[var(--surface-variant)] border border-[var(--border)] text-center">
                        <b className="text-2xl font-bold block text-white">{formatGrade(instituteAvg)}</b>
                        <span className="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Media Istituto</span>
                      </div>
                      <div className="p-3.5 rounded-lg bg-[var(--surface-variant)] border border-[var(--border)] text-center">
                        <b className={`text-2xl font-bold block ${instituteSuffRate === null ? 'text-slate-400' : instituteSuffRate >= 60 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {instituteSuffRate === null ? '—' : `${instituteSuffRate}%`}
                        </b>
                        <span className="text-[10px] uppercase tracking-wider font-semibold text-slate-400">
                          {instituteSuffRate === null ? 'Nessun dato' : 'Sufficienze Totali'}
                        </span>
                      </div>
                      <div className="p-3.5 rounded-lg bg-[var(--surface-variant)] border border-[var(--border)] text-center">
                        <b className="text-2xl font-bold block text-white">{totalStudents}</b>
                        <span className="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Alunni Iscritti</span>
                      </div>
                      <div className="p-3.5 rounded-lg bg-[var(--surface-variant)] border border-[var(--border)] text-center">
                        <b className="text-2xl font-bold block text-cyan-400">{totalGrades}</b>
                        <span className="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Valutazioni Registrate</span>
                      </div>
                    </div>

                    <div
                      className={`p-3 rounded-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs border ${
                        isBackupStale
                          ? 'bg-amber-950/30 border-amber-500/40 text-amber-200'
                          : 'bg-emerald-950/20 border-emerald-500/30 text-emerald-300'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <AlertTriangle className={`w-4 h-4 shrink-0 ${isBackupStale ? 'text-amber-400' : 'text-emerald-400'}`} />
                        <span>
                          Ultimo backup cifrato:{' '}
                          <b>
                            {lastBackupDate
                              ? new Date(lastBackupDate).toLocaleDateString('it-IT', { hour: '2-digit', minute: '2-digit' })
                              : 'Mai effettuato'}
                          </b>
                          {unsavedChangesCount > 0 && ` · (${unsavedChangesCount} modifiche da salvare)`}
                        </span>
                      </div>
                      <button
                        onClick={onExportBackup}
                        className="min-h-[44px] px-3 py-2 rounded bg-[var(--surface-variant)] hover:bg-slate-800 border border-[var(--border)] text-white text-xs font-semibold flex items-center gap-1.5 shrink-0"
                      >
                        <Download className="w-3.5 h-3.5 text-[var(--primary)]" /> Esporta backup cifrato
                      </button>
                    </div>
                  </section>
                )}

                {activeView === 'comparison' && (
                  <section className="neon-card p-4" aria-label="Confronto tra classi">
                    <div className="flex items-center justify-between gap-3 mb-3">
                      <h3 className="text-sm font-semibold text-[var(--primary)] flex items-center gap-2">
                        <TrendingUp className="w-4 h-4" /> Confronto tra classi
                      </h3>
                      <span className="text-xs text-slate-400">{classes.length} sezioni</span>
                    </div>

                    <div className="overflow-x-auto border border-[var(--border)] rounded-lg">
                      <table className="w-full text-xs text-center border-collapse">
                        <thead>
                          <tr className="bg-[var(--surface-variant)] text-slate-400 uppercase tracking-wider text-[10px] font-semibold">
                            <th className="p-2.5 text-left sticky left-0 bg-[var(--surface-variant)] border-r border-[var(--border)] min-w-[140px]">Classe</th>
                            <th className="p-2.5 border-r border-[var(--border)]">Alunni</th>
                            <th className="p-2.5 border-r border-[var(--border)]">Media</th>
                            <th className="p-2.5 border-r border-[var(--border)]">Trend</th>
                            <th className="p-2.5 border-r border-[var(--border)]">Suff. %</th>
                            <th className="p-2.5 border-r border-[var(--border)]">Fascia alta (≥ 8,5)</th>
                            <th className="p-2.5">Media &lt; 6</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[var(--border)]">
                          {classMetrics.length === 0 ? (
                            <tr>
                              <td colSpan={7} className="p-4 text-slate-500">Nessuna classe configurata.</td>
                            </tr>
                          ) : classMetrics.map(item => (
                            <tr key={item.classData.id} className="hover:bg-slate-800/40 transition-colors">
                              <td
                                onClick={() => onSelectClass(item.classData.id)}
                                className="p-2.5 text-left font-semibold text-[var(--primary)] cursor-pointer hover:underline sticky left-0 bg-[var(--surface)] border-r border-[var(--border)]"
                              >
                                {item.classData.name}
                              </td>
                              <td className="p-2.5 border-r border-[var(--border)]">{item.classData.students.length}</td>
                              <td className="p-2.5 border-r border-[var(--border)] font-bold text-white">{formatGrade(item.average)}</td>
                              <td className="p-2.5 border-r border-[var(--border)]">
                                <Sparkline grades={item.grades} width={65} height={20} />
                              </td>
                              <td className="p-2.5 border-r border-[var(--border)]">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${item.sufficiency === null ? 'bg-slate-800 text-slate-400' : item.sufficiency >= 60 ? 'badge-ok' : 'badge-bad'}`}>
                                  {item.sufficiency === null ? '—' : `${item.sufficiency}%`}
                                </span>
                              </td>
                              <td className="p-2.5 border-r border-[var(--border)]">
                                <span className="px-2 py-0.5 rounded text-[10px] font-semibold badge-info">
                                  {item.advancedCount === null ? '—' : item.advancedCount}
                                </span>
                              </td>
                              <td className="p-2.5">
                                <span className="px-2 py-0.5 rounded text-[10px] font-semibold badge-bad">
                                  {item.atRiskCount === null ? '—' : item.atRiskCount}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                )}
              </div>
            );
          };
          EOF

          rm .github/workflows/uxqa01-product-materializer.yml

      - name: Validate and commit product GREEN
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bun install --frozen-lockfile
          bun run lint
          bun run test:security
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/HomeView.tsx tests/browser/ux-trust-01-qualification.spec.cjs .github/workflows/uxqa01-product-materializer.yml
          git diff --cached --check
          git commit -m "feat: make navigation explicit and home teacher-first"
          git push origin HEAD:feat/ux-qa-01-autonomous-navigation
