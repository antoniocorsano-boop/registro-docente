name: UXQA01 test materializer 2

on:
  push:
    branches:
      - feat/ux-qa-01-autonomous-navigation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-qa-01-autonomous-navigation
          fetch-depth: 0
      - name: Narrow dashboard Valutazioni locator and self-remove
        shell: python
        run: |
          from pathlib import Path
          target = Path('tests/browser/ux-qa-01-navigation.spec.cjs')
          text = target.read_text()
          old = "  await page.getByRole('button', { name: 'Valutazioni', exact: true }).click();"
          new = "  await page.locator('main').getByRole('button', { name: 'Valutazioni', exact: true }).click();"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Valutazioni locator, found {text.count(old)}')
          target.write_text(text.replace(old, new))
          Path('.github/workflows/uxqa01-test-materializer-2.yml').unlink()
      - name: Commit exact mechanical change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/ux-qa-01-navigation.spec.cjs .github/workflows/uxqa01-test-materializer-2.yml
          git diff --cached --check
          git commit -m "test: scope UX-QA evaluation navigation"
          git push origin HEAD:feat/ux-qa-01-autonomous-navigation
