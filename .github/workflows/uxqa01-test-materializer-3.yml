name: UXQA01 test materializer 3

on:
  push:
    branches:
      - feat/ux-qa-01-autonomous-navigation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-qa-01-autonomous-navigation
          fetch-depth: 0
      - name: Use canonical planning navigation label and self-remove
        shell: python
        run: |
          from pathlib import Path
          target = Path('tests/browser/ux-qa-01-navigation.spec.cjs')
          text = target.read_text()
          old = "  await openDrawerItem(page, 'Programmazione');"
          new = "  await openDrawerItem(page, 'Programmazione didattica');"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one planning label, found {text.count(old)}')
          target.write_text(text.replace(old, new))
          Path('.github/workflows/uxqa01-test-materializer-3.yml').unlink()
      - name: Commit exact mechanical change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/ux-qa-01-navigation.spec.cjs .github/workflows/uxqa01-test-materializer-3.yml
          git diff --cached --check
          git commit -m "test: use canonical planning navigation label"
          git push origin HEAD:feat/ux-qa-01-autonomous-navigation
