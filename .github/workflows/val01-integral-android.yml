name: VAL-01 D1b.3c — integral historical Android APKs
on:
  pull_request:
    branches: ['main']
    paths:
      - 'src/security/authorizedVaultMigration.ts'
      - 'src/security/versionFencedVaultStore.ts'
      - 'src/security/androidBackupExport.ts'
      - 'src/security/androidSessionLifecycle.ts'
      - 'mobile/android-probe/**'
      - 'tests/browser/fixtures/**'
      - 'scripts/diagnostics/val01-native-migration.mjs'
      - '.github/workflows/val01-integral-android.yml'
      - 'qualification/invariants.v1.json'
permissions:
  contents: read
  actions: read
jobs:
  native-migration:
    strategy:
      fail-fast: false
      matrix:
        predecessor:
          - { name: beta1-rc2, sha: 37c61d4c64993c986a3edcd2b421310adf20de92, version: 10002, run: '43206101783', artifact: '13938285055' }
          - { name: beta1-rc3, sha: b726f4a6dc0eb90a066113bee7cceabf29c629a5, version: 10003, run: '43233573213', artifact: '13950428737' }
          - { name: beta2-rc2, sha: ddbf60781514b866b09e1fa1e014e6a6fc3989d3, version: 10004, run: '43811185219', artifact: '14200343425' }
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HISTORICAL_SHA: ${{ matrix.predecessor.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      OLD_VERSION: ${{ matrix.predecessor.version }}
      OLD_RUN: ${{ matrix.predecessor.run }}
      OLD_ARTIFACT: ${{ matrix.predecessor.artifact }}
      VAL01_INTEGRAL: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify original historical artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OLD_RUN" | jq -e --arg sha "$HISTORICAL_SHA" '.head_sha==$sha and .conclusion=="success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$OLD_ARTIFACT" | jq -e --arg sha "$HISTORICAL_SHA" --arg run "$OLD_RUN" '.expired==false and .workflow_run.head_sha==$sha and (.workflow_run.id|tostring)==$run and .name==("mobile01-android-beta-unsigned-"+$sha)'
          printf 'original_run=%s\noriginal_artifact=%s\n' "$OLD_RUN" "$OLD_ARTIFACT" > native-evidence/provenance.txt
      - uses: actions/download-artifact@v4
        with:
          name: mobile01-android-beta-unsigned-${{ env.HISTORICAL_SHA }}
          run-id: ${{ env.OLD_RUN }}
          github-token: ${{ github.token }}
          path: original-unsigned
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify original unsigned binary and build candidate laboratory bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/val01" native-evidence dist
          apk="$(find original-unsigned -type f -name app-release-unsigned.apk)"
          manifest="$(find original-unsigned -type f -name beta-unsigned-manifest.txt)"
          checksum="$(find original-unsigned -type f -name beta-unsigned.sha256)"
          test -f "$apk" && test -f "$manifest" && test -f "$checksum"
          digest="$(sha256sum "$apk" | awk '{print $1}')"
          test "$digest" = "$(awk '{print $1}' "$checksum")"
          grep -Fx "apk_sha256=$digest" "$manifest"
          grep -Fx "source_sha=$HISTORICAL_SHA" "$manifest"
          grep -Fx 'app_id=it.trama.registrodocente' "$manifest"
          grep -Fx "version_code=$OLD_VERSION" "$manifest"
          grep -Fx 'release_signing=false' "$manifest"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then exit 1; fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/val01/original.badging"
          grep -F "package: name='it.trama.registrodocente' versionCode='$OLD_VERSION'" "$RUNNER_TEMP/val01/original.badging"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/val01/original.badging"; then exit 1; fi
          cp "$apk" "$RUNNER_TEMP/val01/original.apk"
          printf 'candidate=%s\nhistorical=%s\noriginal_unsigned_sha256=%s\n' "$CANDIDATE_SHA" "$HISTORICAL_SHA" "$digest" >> native-evidence/provenance.txt
          bun install --frozen-lockfile
          bun run lint
          bun build mobile/android-probe/val01-native-lab.fixture.ts --target browser --format iife --outfile dist/fixture.js
          node --check scripts/diagnostics/val01-native-migration.mjs
          sha256sum dist/fixture.js >> native-evidence/provenance.txt
          printf '<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAL-01 CI laboratory ONLY</title><body><h1>VAL-01 — Synthetic CI laboratory only</h1><script src="fixture.js"></script></body></html>' > dist/index.html
      - name: Archive original unsigned historical binary for repeatability only
        uses: actions/upload-artifact@v4
        with:
          name: val01-preserved-original-unsigned-${{ env.HISTORICAL_SHA }}-${{ env.CANDIDATE_SHA }}
          path: |
            original-unsigned/**/app-release-unsigned.apk
            original-unsigned/**/beta-unsigned.sha256
            original-unsigned/**/beta-unsigned-manifest.txt
          retention-days: 14
          if-no-files-found: error
      - name: Build candidate CI-only debug APK and re-sign original with ephemeral debug key
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix mobile/android-probe --no-audit --no-fund --package-lock=false
          cd mobile/android-probe
          npx --no-install cap add android
          npx --no-install cap sync android
          node prepare-native-back.mjs
          cp native/*.java android/app/src/main/java/it/trama/registrodocente/prova/
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path('android/app')
          def change(p,pattern,value):
              f=root/p
              text,n=re.subn(pattern,value,f.read_text())
              assert n==1,(p,pattern,n)
              f.write_text(text)
          change('build.gradle',r'applicationId\s+"it\.trama\.registrodocente\.prova"','applicationId "it.trama.registrodocente"')
          change('build.gradle',r'versionCode\s+1\b','versionCode 10005')
          change('src/main/AndroidManifest.xml',r'android:name="\.MainActivity"','android:name="it.trama.registrodocente.prova.MainActivity"')
          change('src/main/AndroidManifest.xml',r'android:allowBackup="true"','android:allowBackup="false" android:fullBackupContent="false"')
          p=root/'src/main/assets/capacitor.config.json'
          c=json.loads(p.read_text())
          assert not c.get('server',{}).get('url')
          c['appId']='it.trama.registrodocente'
          c['appName']='VAL01 CI laboratory ONLY'
          p.write_text(json.dumps(c))
          PY
          (cd android; bash ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/val01/new-initial.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          # Do not depend on Gradle's environment-dependent default debug.keystore.
          # Explicit ephemeral CI-only certificate, applied to both packages.
          key="$RUNNER_TEMP/val01/ci-signing.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$key" -storepass SyntheticCIOnly2026 -keypass SyntheticCIOnly2026 -alias val01-ci-only -keyalg RSA -keysize 2048 -validity 3 -dname 'CN=VAL01 SYNTHETIC CI ONLY'
          chmod 600 "$key"
          echo 'Ephemeral CI key created'
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/val01/original.apk" "$RUNNER_TEMP/val01/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias val01-ci-only --ks-pass pass:SyntheticCIOnly2026 --key-pass pass:SyntheticCIOnly2026 --out "$RUNNER_TEMP/val01/old.apk" "$RUNNER_TEMP/val01/aligned.apk"
          echo 'Original binary signed for isolated CI'
          "$tools/apksigner" sign --ks "$key" --ks-key-alias val01-ci-only --ks-pass pass:SyntheticCIOnly2026 --key-pass pass:SyntheticCIOnly2026 --out "$RUNNER_TEMP/val01/new.apk" "$RUNNER_TEMP/val01/new-initial.apk"
          echo 'Candidate binary signed for isolated CI'
          for apk in old new; do
            file="$RUNNER_TEMP/val01/$apk.apk"
            "$tools/apksigner" verify --print-certs "$file" > "$RUNNER_TEMP/val01/$apk.cert"
            "$tools/aapt" dump badging "$file" > "$RUNNER_TEMP/val01/$apk.badging"
            grep -F "package: name='it.trama.registrodocente'" "$RUNNER_TEMP/val01/$apk.badging"
            sha256sum "$file" >> ../../native-evidence/provenance.txt
          done
          for apk in old new; do
            test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' "$RUNNER_TEMP/val01/$apk.cert")" = 1
          done
          diff <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/val01/old.cert") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/val01/new.cert")
          unzip -p "$RUNNER_TEMP/val01/new.apk" assets/public/fixture.js | cmp - ../../dist/fixture.js
          # Verify historical manifest and all original assets/dex/resources are byte-identical.
          python3 - <<'PY'
          import os,zipfile,pathlib,hashlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'val01'
          with zipfile.ZipFile(d/'original.apk') as a,zipfile.ZipFile(d/'old.apk') as b:
              names=lambda z: {n for n in z.namelist() if not n.startswith('META-INF/') and not n.endswith('/')}
              assert names(a)==names(b)
              for n in names(a): assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
          PY
          printf 'OLD_APK=%s\nNEW_APK=%s\n' "$RUNNER_TEMP/val01/old.apk" "$RUNNER_TEMP/val01/new.apk" >> "$GITHUB_ENV"
      - name: Enable isolated emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Real Android SAF roundtrip, in-place migration and downgrade
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: timeout --signal=TERM --kill-after=10s 600s node scripts/diagnostics/val01-native-migration.mjs
      - name: Require explicit support-scope native evidence
        run: |
          set -euo pipefail
          jq -e --arg old "$HISTORICAL_SHA" --arg new "$CANDIDATE_SHA" --argjson version "$OLD_VERSION" '
            .predecessor==$old and .candidate==$new and .productionRelease==false and
            all(.results[];.status=="PASS") and
            (if $version==10002 then
              .qualification=="negative-only" and
              ([.results[].stage]==["historical-seed-cold-reopen","unsupported-sparse-archive-refused-without-mutation","unsupported-sparse-original-reopen"]) and
              (.results[1].qualification=="negative-only" and .results[1].present==["appData","meta"] and (.results[1].missing|length)==8 and (.results[1].physicalSha256|test("^[a-f0-9]{64}$")))
            elif $version==10003 or $version==10004 then
              .qualification=="supported-migration" and
              ([.results[].stage]==["historical-seed-cold-reopen","native-saf-write-readback","native-picker-cancel-no-migration","native-wrong-copy-password-no-migration","native-explicit-refusal-no-migration","native-authorized-migration-and-replay-rejection","native-v2-cold-reopen","original-downgrade-ui-fail-closed","native-reupgrade-archive-intact"])
            else false end)
          ' native-evidence/result.json
      - name: Destroy signed laboratory APKs and key
        if: always()
        run: rm -rf "$RUNNER_TEMP/val01"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: val01-integral-lab-${{ matrix.predecessor.name }}-${{ env.CANDIDATE_SHA }}
          path: native-evidence/
          retention-days: 7
          if-no-files-found: error
