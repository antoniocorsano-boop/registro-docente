# Immutable application HEAD: separate harness branch, no release or production access.
name: VAL-01 S7d.2d — V10 durable receipt exact-SHA qualification
on:
  push:
    branches: ['qual/val01-s7d2d-da740-exact']
permissions:
  contents: read
env:
  APPLICATION_SHA: da740b1d718b246cd2ddb07681d9246423f3abb9
jobs:
  qualify:
    name: "168 invariants / encrypted staging / V10 / Web + Android / full security"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout application SHA, not qualification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.APPLICATION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact SHA and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          git diff --quiet
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check invariants
        run: node scripts/qualification/check-invariants.mjs
      - name: Reference browser coverage mapping
        run: bun scripts/qualification/check-reference-browser-coverage.mjs
      - name: Qualify S7d.2d lab + S7d.2c S7d.2b and secured storage
        run: bun test src/security/val01Product05V10DurableReceipt.test.ts src/security/val01Product05V10PhysicalCopy.test.ts src/security/val01Product05V10Backup.test.ts src/security/val01Product05DurableLab.test.ts src/security/val01Product05History.test.ts src/security/doc01InstitutionalBackupPayloadV9.test.ts src/security/secureAppStorage.test.ts
      - name: Web/Android copy and restore contract regression
        run: bun test src/security/androidBackupExport.test.ts src/security/androidBackupRestore.test.ts src/security/webBackupVerification.test.ts src/security/mobile01M2aNativeBackupContract.test.ts src/security/mobile01M2bNativeRestoreContract.test.ts
      - name: Full security and memory suite
        run: bun run test:security
      - name: TypeScript and production build, without deployment
        run: |
          bun run lint
          bun run build
      - name: Verify candidate remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          git diff --quiet
          echo 'V10_S7D2D_EXACT_SHA_SECURITY_PASS_STAGING_ONLY_NOT_NATIVE_NOT_MAIN_RELEASE'
