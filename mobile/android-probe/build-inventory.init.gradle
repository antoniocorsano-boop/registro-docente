import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import java.security.MessageDigest

String digest(File file) {
    def hash = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) hash.update(buffer, 0, count)
    }
    hash.digest().encodeHex().toString()
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def app = root.project(':app')
    app.tasks.register('captureNativeBuildInventory') {
        dependsOn 'captureReleaseNativeInventory'
        doLast {
            def classpaths = root.allprojects.collect { project ->
                def configuration = project.buildscript.configurations.findByName('classpath')
                if (configuration == null || configuration.dependencies.empty) return null
                def edges = configuration.incoming.resolutionResult.allDependencies.collect { edge ->
                    if (!(edge instanceof ResolvedDependencyResult)) {
                        throw new GradleException("Unresolved buildscript dependency in ${project.path}")
                    }
                    [from: edge.from.id.displayName, requested: edge.requested.displayName,
                     selected: edge.selected.id.displayName]
                }.sort { [it.from, it.requested, it.selected].join('\n') }
                def artifacts = configuration.incoming.artifacts.artifacts.collect { artifact ->
                    [component: artifact.id.componentIdentifier.displayName,
                     file: artifact.file.name, sha256: digest(artifact.file)]
                }.sort { [it.component, it.file].join('\n') }
                if (edges.empty || artifacts.empty) throw new GradleException("Empty buildscript evidence in ${project.path}")
                [project: project.path, configuration: 'buildscript:classpath', edges: edges, artifacts: artifacts]
            }.findAll { it != null }
            if (classpaths.empty) throw new GradleException('Missing Android buildscript classpaths')
            def apk = app.layout.buildDirectory.file('outputs/apk/release/app-release-unsigned.apk').get().asFile
            def receipt = [source_sha: System.getenv('SOURCE_SHA'), apk_sha256: digest(apk),
                           gradle: gradle.gradleVersion, classpaths: classpaths]
            new File(root.projectDir.parentFile, 'native-build-gradle.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(receipt)) + '\n', 'UTF-8')
        }
    }
}
